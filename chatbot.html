<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente JB Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset y variables ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0B0C12;
      --surface:      #13141E;
      --bubble-bot:   #1A1B25;
      --bubble-user:  #6C5FFF;
      --accent:       #6C5FFF;
      --accent-hover: #7D71FF;
      --green:        #1FD98A;
      --wa-green:     #25D366;
      --wa-hover:     #20C276;
      --text:         #FFFFFF;
      --text-soft:    #C5C7D4;
      --text-muted:   #6B6D82;
      --border:       rgba(255, 255, 255, 0.07);
      --radius-lg:    22px;
      --radius-md:    14px;
      --radius-sm:    8px;
      --font:         'DM Sans', system-ui, -apple-system, sans-serif;
      --shadow:       0 32px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.05);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      /* Patrón de puntos muy sutil en el fondo */
      background-image: radial-gradient(rgba(108, 95, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Widget principal ────────────────────────────────────────────────── */
    .chat-widget {
      width: 100%;
      max-width: 420px;
      height: 620px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* ── Cabecera ─────────────────────────────────────────────────────────── */
    .chat-header {
      padding: 16px 18px;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C5FFF 0%, #A89BFF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(108,95,255,0.2);
    }

    .chat-header-info { flex: 1; }

    .chat-header-info h3 {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    .chat-header-status {
      margin-top: 2px;
      font-size: 11px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .chat-header-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: var(--border);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* ── Área de mensajes ─────────────────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overscroll-behavior: contain;
    }

    /* Scrollbar fino y discreta */
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
    }

    /* ── Filas de mensajes ────────────────────────────────────────────────── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: msg-slide 0.22s ease forwards;
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot  { justify-content: flex-start; }

    @keyframes msg-slide {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* Avatar pequeño del bot */
    .bot-avatar-sm {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C5FFF, #A89BFF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    /* ── Burbujas ─────────────────────────────────────────────────────────── */
    .bubble {
      max-width: 80%;
      padding: 10px 13px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      color: var(--text);
    }

    .bubble.bot {
      background: var(--bubble-bot);
      border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 3px;
      color: var(--text-soft);
    }

    .bubble.user {
      background: var(--bubble-user);
      border-radius: var(--radius-md) var(--radius-md) 3px var(--radius-md);
      color: #fff;
    }

    /* Hora del mensaje */
    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
      text-align: right;
    }

    .msg-row.bot .msg-time { text-align: left; padding-left: 34px; }

    /* ── Typing dots ─────────────────────────────────────────────────────── */
    .typing-bubble {
      background: var(--bubble-bot);
      border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 3px;
      padding: 12px 16px;
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.35; }
      30%            { transform: translateY(-5px); opacity: 1;    }
    }

    /* ── Botón WhatsApp ──────────────────────────────────────────────────── */
    .wa-btn-wrap { margin-top: 14px; }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px;
      background: var(--wa-green);
      color: #fff;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(37,211,102,0.3);
    }

    .wa-btn:hover {
      background: var(--wa-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37,211,102,0.4);
    }

    .wa-btn:active { transform: translateY(0); }

    .wa-btn svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* ── Input area ───────────────────────────────────────────────────────── */
    .chat-input-area {
      padding: 10px 14px 14px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 9px;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 104px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
      overflow-y: auto;
    }

    .chat-input::placeholder { color: var(--text-muted); }

    .chat-input:focus {
      border-color: rgba(108, 95, 255, 0.55);
      background: rgba(108, 95, 255, 0.06);
    }

    .chat-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Botón enviar */
    .send-btn {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, transform 0.13s;
    }

    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:active:not(:disabled) { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .send-btn svg { width: 17px; height: 17px; }

    /* ── Links de plantillas dentro del chat ────────────────────────────── */
    .tmpl-link {
      color: #1FD98A;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(31, 217, 138, 0.4);
      text-underline-offset: 2px;
      font-weight: 500;
      border-radius: 3px;
      transition: opacity 0.15s, text-decoration-color 0.15s;
    }

    .tmpl-link:hover {
      opacity: 0.8;
      text-decoration-color: rgba(31, 217, 138, 0.9);
    }

    .tmpl-link:focus-visible {
      outline: 2px solid #1FD98A;
      outline-offset: 2px;
    }

    /* ── Mensaje de error ────────────────────────────────────────────────── */
    .bubble.error {
      background: rgba(255, 90, 90, 0.1);
      border: 1px solid rgba(255, 90, 90, 0.2);
      color: #FF9090;
      font-size: 13px;
    }

    /* ── Nota de API key faltante ────────────────────────────────────────── */
    .api-warning {
      margin: 10px 14px;
      padding: 10px 12px;
      background: rgba(255, 180, 0, 0.08);
      border: 1px solid rgba(255, 180, 0, 0.2);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: #FFB84D;
      line-height: 1.5;
      flex-shrink: 0;
    }

    /* ── Botón "Nueva conversación" ─────────────────────────────────────── */
    .btn-reset {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6C5FFF;
      opacity: 0.65;
      transition: opacity 0.18s, background 0.18s;
      flex-shrink: 0;
    }

    .btn-reset:hover  { opacity: 1; background: rgba(108, 95, 255, 0.1); }
    .btn-reset:active { transform: scale(0.92); }
    .btn-reset svg    { width: 16px; height: 16px; }

    /* ── Quick reply chips ───────────────────────────────────────────────── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 0 34px;
    }

    .qr-chip {
      padding: 8px 14px;
      background: transparent;
      border: 1.5px solid rgba(108, 95, 255, 0.45);
      border-radius: 999px;
      color: #A89BFF;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.15s;
      white-space: nowrap;
      animation: msg-slide 0.22s ease forwards;
    }

    .qr-chip:hover {
      background: rgba(108, 95, 255, 0.15);
      border-color: rgba(108, 95, 255, 0.75);
      color: #fff;
      transform: translateY(-1px);
    }

    .qr-chip:active { transform: translateY(0); }

    /* ── Responsive: mobile full screen ─────────────────────────────────── */
    @media (max-width: 460px) {
      body { padding: 0; align-items: stretch; }
      .chat-widget {
        border-radius: 0;
        height: 100dvh;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="chat-widget">

    <!-- Cabecera del widget -->
    <div class="chat-header">
      <div class="chat-avatar">✦</div>
      <div class="chat-header-info">
        <h3>JB Studio Assistant</h3>
        <div class="chat-header-status">
          <span class="status-dot"></span>
          Online now
        </div>
      </div>
      <div class="chat-header-badge">IA</div>
      <button class="btn-reset" id="btnReset" title="New conversation" aria-label="Start a new conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </button>
    </div>

    <!-- Área de mensajes -->
    <div class="chat-messages" id="chatMessages"></div>

    <!-- Input fijo en la parte inferior -->
    <div class="chat-input-area">
      <textarea
        class="chat-input"
        id="chatInput"
        placeholder="Type your message..."
        rows="1"
        disabled
        aria-label="Message the assistant"
      ></textarea>
      <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
        <!-- Ícono de enviar -->
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // CONFIGURACIÓN
    // ─────────────────────────────────────────────────────────────────────────

    const WA_NUMBER = '15035931690';
    const IG_USER   = 'jb__studiodesing';

    // ─────────────────────────────────────────────────────────────────────────
    // SYSTEM PROMPT — instrucciones del bot
    // ─────────────────────────────────────────────────────────────────────────
    const SYSTEM_PROMPT = `You are the virtual assistant for JB Studio (jbstudio.app), a digital services agency run by Mike. You speak English by default, but if the user writes in Spanish, switch to Spanish immediately and stay in Spanish.

JB STUDIO OFFERS 3 SERVICES:

1. WEBSITES
   - Template-based: starting at $299 (client picks template, Mike customizes it)
   - Custom: starting at $499 (fully custom design)
   - Fast delivery, professional, mobile-ready
   - For local businesses: barbershops, restaurants, salons, clinics, gyms, real estate, etc.

2. AI CHATBOTS
   - Basic Bot: $197 setup + $45/month — Answers FAQs, captures leads, sends them to WhatsApp, works 24/7
   - Pro Bot: $347 setup + $65/month — Everything in Basic + takes appointment requests + sends email confirmations to client and business + handles multiple services
   - Premium Bot: $497 setup + $90/month — Everything in Pro + custom flows + priority support + monthly optimization
   - All chatbots are embedded on the client's website with one line of code
   - Mike handles everything, client does nothing

3. FLOWBOOK APP (flowbookapp.co)
   - Appointment booking app available on Google Play Store
   - Designed for small local businesses: barbershops, salons, nail studios, spas, etc.
   - Features: automated booking, client reminders, payment tracking, multi-staff support
   - Free trial available, then flat monthly pricing
   - No commission per booking (unlike competitors)
   - Download at: flowbookapp.co or search "FlowBook" on Google Play

YOUR GOAL:
Qualify the visitor and guide them to the right service. Ask what type of business they have, then recommend the most relevant service.

QUALIFICATION FLOW:
1. Ask what type of business they have
2. Ask if they currently have a website
3. Based on answers, recommend:
   - No website → Website service first
   - Has website, gets many client questions → AI Chatbot
   - Takes appointments → FlowBook or Pro Bot
   - Needs all three → explain the full package

CONTACT — INSTAGRAM ONLY:
NEVER share any contact link proactively. Only share Instagram when the visitor shows a CLEAR purchase signal.

Purchase signals:
- English: "I want to hire", "let's do it", "I'm ready", "how do I pay", "sign me up", "I want the plan", "let's get started", "how much in total", "I'll take it", "where do I sign"
- Spanish: "quiero contratar", "cuándo empezamos", "cómo pago", "me interesa contratarlo", "quiero el plan", "listo lo quiero", "cuánto es en total", "cómo empezamos", "quiero comenzar"

Rules:
- If they only ask about prices → give prices, do NOT share Instagram.
- If they ask "how do I contact you?" without a purchase signal → say they can keep asking here, and when they're ready you'll connect them.
- When you detect a clear purchase signal, respond with ONLY this (match the conversation language):

ENGLISH: "Awesome! Mike will take care of everything. Contact him directly on Instagram to get started:
👉 instagram.com/${IG_USER}
He usually replies within a few hours. Just tell him what you need and he'll send you all the details!"

SPANISH: "¡Perfecto! Mike se encarga de todo. Escríbele directo por Instagram para comenzar:
👉 instagram.com/${IG_USER}
Suele responder en pocas horas. Solo cuéntale qué necesitas y él te manda todos los detalles."

TONE: Friendly, professional, concise. No long paragraphs. Max 3 sentences per response.
Never say services are free. Never make up prices.`;

    // ─────────────────────────────────────────────────────────────────────────
    // ESTADO DE LA CONVERSACIÓN
    // ─────────────────────────────────────────────────────────────────────────

    let messages  = [];
    let isLoading = false;
    let userLang  = null; // 'en' | 'es' — set by language picker, locked for the session

    // ─────────────────────────────────────────────────────────────────────────
    // CLAVES DE PERSISTENCIA
    // ─────────────────────────────────────────────────────────────────────────
    const LS_HISTORY = 'jb-chat-history';
    const LS_BUBBLES = 'jb-chat-bubbles';
    const LS_LANG    = 'jb-chat-lang';

    // ─────────────────────────────────────────────────────────────────────────
    // REFERENCIAS AL DOM
    // ─────────────────────────────────────────────────────────────────────────
    const chatMessages = document.getElementById('chatMessages');
    const chatInput    = document.getElementById('chatInput');
    const sendBtn      = document.getElementById('sendBtn');
    const btnReset     = document.getElementById('btnReset');

    // ─────────────────────────────────────────────────────────────────────────
    // PERSISTENCIA: guarda el estado actual en localStorage
    // Se llama (a) tras cada push al array messages[] de un usuario real,
    // y (b) tras renderizar cada burbuja del bot en el DOM.
    // ─────────────────────────────────────────────────────────────────────────
    function saveState() {
      try {
        localStorage.setItem(LS_HISTORY, JSON.stringify(messages));
        localStorage.setItem(LS_BUBBLES, chatMessages.innerHTML);
        if (userLang) localStorage.setItem(LS_LANG, userLang);
      } catch (e) {
        console.warn('[chatbot] Could not save to localStorage:', e);
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // RESET: borra historial, limpia el DOM y reinicia el saludo automático
    // ─────────────────────────────────────────────────────────────────────────
    function resetChat() {
      localStorage.removeItem(LS_HISTORY);
      localStorage.removeItem(LS_BUBBLES);
      localStorage.removeItem(LS_LANG);
      messages  = [];
      userLang  = null;
      chatMessages.innerHTML = '';
      chatInput.disabled = true;
      sendBtn.disabled   = true;
      initChat();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // UTILIDADES DE HORA
    // ─────────────────────────────────────────────────────────────────────────
    function nowHHMM() {
      return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    }

    // ─────────────────────────────────────────────────────────────────────────
    // TABLA DE PLANTILLAS: nombre exacto → slug de preview.html
    // Ordenada de mayor a menor longitud para evitar coincidencias parciales
    // (ej: "Social Media Agency Landing Page" antes que "Agency Landing Page").
    // ─────────────────────────────────────────────────────────────────────────
    const TEMPLATE_SLUGS = {
      "Social Media Agency Landing Page": "social-media-agency",
      "Business Consulting Website":      "business-consulting",
      "Consulting Business Website":      "consulting-business",
      "Minimal Product Portfolio":        "minimal-product-portfolio",
      "Minimal Personal Portfolio":       "minimal-personal-portfolio",
      "Digital Designer Portfolio":       "digital-designer-portfolio",
      "Dark Creative Portfolio":          "dark-creative-portfolio",
      "Dark Designer Portfolio":          "dark-designer-portfolio",
      "Luxury Brand Portfolio":           "luxury-brand-portfolio",
      "Clover Product Landing":           "clover-product",
      "Sonic Product Landing":            "sonic-product",
      "Fitness Product Website":          "fitness-product",
      "Medical Service Website":          "medical-service",
      "Yoga / Wellness Website":          "yoga-wellness",
      "Pet Grooming Website":             "pet-grooming",
      "Hair Salon Website":               "hair-salon",
      "Business Consultancy":             "business-consultancy",
      "Agency Landing Page":              "agency-landing",
      "Brandora Agency":                  "brandora-agency",
      "Cafe Premium":                     "cafe-premium",
      "Agency Pro":                       "agency-pro",
    };

    // Nombres ordenados de mayor a menor longitud (para el regex sweep)
    const TEMPLATE_NAMES = Object.keys(TEMPLATE_SLUGS);

    // ─────────────────────────────────────────────────────────────────────────
    // LINKIFY DE PLANTILLAS
    // Busca nombres de plantillas en el HTML ya escapado y los envuelve en
    // <span class="tmpl-link"> para que sean clickeables en color #1FD98A.
    // Se ejecuta DESPUÉS del escape HTML y ANTES de convertir \n → <br>.
    // ─────────────────────────────────────────────────────────────────────────
    function linkifyTemplates(escapedHtml) {
      let result = escapedHtml;
      TEMPLATE_NAMES.forEach(name => {
        const slug = TEMPLATE_SLUGS[name];
        // Escapa caracteres especiales de regex presentes en el nombre
        const safePattern = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const rx = new RegExp(safePattern, 'gi');
        result = result.replace(rx, match =>
          `<span class="tmpl-link" data-slug="${slug}" role="button" tabindex="0" title="Click to preview">${match}</span>`
        );
      });
      return result;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // FORMATEO DE TEXTO
    // Pipeline: escape HTML → linkify plantillas → saltos de línea → HTML final
    // ─────────────────────────────────────────────────────────────────────────
    function formatText(raw) {
      const escaped = raw
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const linked = linkifyTemplates(escaped);
      return linked.replace(/\n/g, '<br>');
    }

    // ─────────────────────────────────────────────────────────────────────────
    // EXTRACCIÓN DEL BRIEF
    // Busca el marcador {{BRIEF:{...}}} en la respuesta de Claude,
    // parsea el JSON y devuelve el texto limpio sin el marcador.
    // ─────────────────────────────────────────────────────────────────────────
    function extractBrief(text) {
      const match = text.match(/\{\{BRIEF:([\s\S]*?)\}\}/);
      if (!match) return { cleanText: text, briefData: null };

      let briefData = null;
      try {
        briefData = JSON.parse(match[1]);
      } catch (err) {
        console.warn('[chatbot] No se pudo parsear el brief JSON:', err, match[1]);
      }

      // Elimina el marcador del texto visible y limpia espacios sobrantes
      const cleanText = text.replace(/\{\{BRIEF:[\s\S]*?\}\}/, '').trimEnd();
      return { cleanText, briefData };
    }

    // ─────────────────────────────────────────────────────────────────────────
    // CONSTRUCCIÓN DEL BOTÓN DE WHATSAPP
    // Genera el mensaje pre-llenado y retorna el elemento <a>.
    // ─────────────────────────────────────────────────────────────────────────
    function buildWAButton(data) {
      const lines = [
        'Hi! I just completed the form on your website. Here is my project summary:',
        '',
        `Name: ${data.name}`,
        `Business: ${data.business}`,
        `Template: ${data.template} — ${data.price}`,
        `Logo: ${data.logo}`,
        `Photos: ${data.photos}`,
        `Texts/Copy: ${data.texts}`,
        `Domain/Hosting: ${data.hosting}`,
        `Deadline: ${data.deadline}`,
      ];

      const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(lines.join('\n'))}`;

      const wrap = document.createElement('div');
      wrap.className = 'wa-btn-wrap';

      const a = document.createElement('a');
      a.href    = waUrl;
      a.target  = '_blank';
      a.rel     = 'noopener noreferrer';
      a.className = 'wa-btn';

      // Ícono SVG oficial de WhatsApp
      a.innerHTML = `
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        💬 Hablar con el diseñador por WhatsApp
      `;

      wrap.appendChild(a);
      return wrap;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // AGREGAR MENSAJE AL CHAT
    // role: 'bot' | 'user' | 'error'
    // briefData: objeto con datos del brief (solo en paso 7)
    // ─────────────────────────────────────────────────────────────────────────
    function addMessage(role, text, briefData) {
      const isBot = role === 'bot' || role === 'error';

      // Fila contenedora
      const row = document.createElement('div');
      row.className = `msg-row ${isBot ? 'bot' : 'user'}`;

      // Avatar pequeño (solo en mensajes del bot)
      if (isBot) {
        const av = document.createElement('div');
        av.className = 'bot-avatar-sm';
        av.textContent = '✦';
        row.appendChild(av);
      }

      // Columna para burbuja + hora
      const col = document.createElement('div');

      // Burbuja
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role === 'error' ? 'bot error' : role}`;
      bubble.innerHTML  = formatText(text);

      // Botón de WhatsApp (solo si hay datos del brief)
      if (briefData) {
        bubble.appendChild(buildWAButton(briefData));
      }

      col.appendChild(bubble);

      // Hora del mensaje
      const time = document.createElement('div');
      time.className   = 'msg-time';
      time.textContent = nowHHMM();
      col.appendChild(time);

      row.appendChild(col);
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // INDICADOR DE ESCRITURA (typing dots)
    // ─────────────────────────────────────────────────────────────────────────
    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.id = 'typingRow';

      const av = document.createElement('div');
      av.className = 'bot-avatar-sm';
      av.textContent = '✦';

      const bubble = document.createElement('div');
      bubble.className = 'typing-bubble';
      bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

      row.appendChild(av);
      row.appendChild(bubble);
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      const row = document.getElementById('typingRow');
      if (row) row.remove();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // LLAMADA A LA API DE ANTHROPIC
    // Envía el historial completo + system prompt y retorna el texto de Claude.
    // ─────────────────────────────────────────────────────────────────────────
    function getSystemPrompt(lang) {
      const lock = (lang === 'es')
        ? 'IDIOMA BLOQUEADO: El usuario eligió español. Responde SIEMPRE en español, sin excepción. Nunca cambies al inglés.'
        : 'LANGUAGE LOCKED: The user chose English. ALWAYS respond in English, no exceptions. Never switch to Spanish.';
      return lock + '\n\n' + SYSTEM_PROMPT;
    }

    async function callAPI(userContent) {
      // Agrega el mensaje del usuario al historial antes de llamar
      messages.push({ role: 'user', content: userContent });

      // Guarda inmediatamente tras el push del usuario.
      // En este punto el DOM ya tiene la burbuja del usuario (addMessage fue
      // llamado antes en handleSend), así que el snapshot es coherente.
      // Se omite para el trigger interno '(start)' porque no es un mensaje real.
      if (userContent !== '(start)') saveState();

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages,
          systemPrompt: getSystemPrompt(userLang),
        }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        messages.pop();
        throw new Error(errData.error || `HTTP ${res.status}`);
      }

      const data    = await res.json();
      const botText = data.text || '';

      // Guarda la respuesta del bot en el historial
      messages.push({ role: 'assistant', content: botText });
      return botText;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // BLOQUEAR / DESBLOQUEAR LA UI
    // ─────────────────────────────────────────────────────────────────────────
    function lockUI() {
      isLoading = true;
      chatInput.disabled = true;
      sendBtn.disabled   = true;
    }

    function unlockUI() {
      isLoading = false;
      chatInput.disabled = false;
      sendBtn.disabled   = false;
      chatInput.focus();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // ENVIAR MENSAJE DEL USUARIO
    // ─────────────────────────────────────────────────────────────────────────
    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text || isLoading) return;

      removeQuickReplies();

      chatInput.value = '';
      chatInput.style.height = 'auto';

      addMessage('user', text);
      lockUI();
      showTyping();

      try {
        const botRaw = await callAPI(text);
        hideTyping();
        const { cleanText, briefData } = extractBrief(botRaw);
        addMessage('bot', cleanText, briefData);
        saveState();
      } catch (err) {
        hideTyping();
        addMessage('error', `Could not connect to the assistant. Please try again.\n\nError: ${err.message}`);
        console.error('[chatbot] API error:', err);
      }

      unlockUI();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // QUICK REPLIES — language picker + service chips
    // ─────────────────────────────────────────────────────────────────────────
    function removeQuickReplies() {
      const el = document.getElementById('quickReplies');
      if (el) el.remove();
    }

    function renderChips(chips) {
      const row = document.createElement('div');
      row.className = 'quick-replies';
      row.id = 'quickReplies';
      chips.forEach(({ label, onClick }) => {
        const btn = document.createElement('button');
        btn.className   = 'qr-chip';
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        row.appendChild(btn);
      });
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function showLangPicker() {
      renderChips([
        { label: '🇺🇸 English', onClick: () => selectLanguage('en') },
        { label: '🇪🇸 Español', onClick: () => selectLanguage('es') },
      ]);
    }

    function selectLanguage(lang) {
      userLang = lang;
      removeQuickReplies();
      if (lang === 'en') {
        addMessage('bot', 'Perfect! What can I help you with today?');
        renderChips([
          { label: '🌐 I need a website',        onClick: () => sendQuickReply('I need a website') },
          { label: '🤖 I want a chatbot',         onClick: () => sendQuickReply('I want a chatbot') },
          { label: '📅 Booking app (FlowBook)',   onClick: () => sendQuickReply('Tell me about FlowBook') },
        ]);
      } else {
        addMessage('bot', '¡Perfecto! ¿En qué te puedo ayudar hoy?');
        renderChips([
          { label: '🌐 Necesito una página web',    onClick: () => sendQuickReply('Necesito una página web') },
          { label: '🤖 Quiero un chatbot',           onClick: () => sendQuickReply('Quiero un chatbot') },
          { label: '📅 App de reservas (FlowBook)',  onClick: () => sendQuickReply('Cuéntame sobre FlowBook') },
        ]);
      }
    }

    async function sendQuickReply(text) {
      if (isLoading) return;
      removeQuickReplies();
      addMessage('user', text);
      lockUI();
      showTyping();

      try {
        const botRaw = await callAPI(text);
        hideTyping();
        const { cleanText, briefData } = extractBrief(botRaw);
        addMessage('bot', cleanText, briefData);
        saveState();
      } catch (err) {
        hideTyping();
        addMessage('error', `Could not connect to the assistant. Please try again.\n\nError: ${err.message}`);
        console.error('[chatbot] API error:', err);
      }

      unlockUI();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // INICIO DEL CHAT
    // ─────────────────────────────────────────────────────────────────────────
    function initChat() {
      // ── Restore saved session ─────────────────────────────────────────────
      const savedHistory = localStorage.getItem(LS_HISTORY);
      const savedBubbles = localStorage.getItem(LS_BUBBLES);

      if (savedHistory && savedBubbles) {
        try {
          const parsed = JSON.parse(savedHistory);
          if (Array.isArray(parsed) && parsed.length > 0) {
            messages = parsed;
            userLang = localStorage.getItem(LS_LANG) || 'en';
            chatMessages.innerHTML = savedBubbles;
            scrollToBottom();
            unlockUI();
            return;
          }
        } catch (e) {
          console.warn('[chatbot] Corrupted history, starting fresh:', e);
          localStorage.removeItem(LS_HISTORY);
          localStorage.removeItem(LS_BUBBLES);
          localStorage.removeItem(LS_LANG);
        }
      }

      // ── Fresh start: bilingual greeting + language picker ─────────────────
      addMessage('bot', "Hi! 👋 / ¡Hola! 👋\nWhat language do you prefer?\n¿En qué idioma prefieres hablar?");
      showLangPicker();
      unlockUI();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // EVENTOS
    // ─────────────────────────────────────────────────────────────────────────

    // Clic en un nombre de plantilla dentro del chat →
    // postMessage al padre para que abra preview.html?template=[slug],
    // replicando exactamente el comportamiento del botón .btn-live del catálogo.
    chatMessages.addEventListener('click', e => {
      const link = e.target.closest('.tmpl-link');
      if (!link) return;
      const slug = link.dataset.slug;
      if (!slug) return;
      // Envía el slug al padre (index.html); el padre navega a preview.html
      window.parent.postMessage({ type: 'jb-preview', slug }, window.location.origin);
    });

    // Soporte de teclado para los links de plantillas (Enter / Space)
    chatMessages.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const link = e.target.closest('.tmpl-link');
      if (!link) return;
      e.preventDefault();
      const slug = link.dataset.slug;
      if (slug) window.parent.postMessage({ type: 'jb-preview', slug }, window.location.origin);
    });

    // Botón "Nueva conversación" — borra historial y reinicia sin confirmación
    btnReset.addEventListener('click', resetChat);

    // Botón enviar
    sendBtn.addEventListener('click', handleSend);

    // Enter envía el mensaje; Shift+Enter inserta salto de línea
    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Auto-resize del textarea al escribir
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 104) + 'px';
    });

    // ─────────────────────────────────────────────────────────────────────────
    // ARRANQUE
    // ─────────────────────────────────────────────────────────────────────────
    initChat();
  </script>
</body>
</html>
