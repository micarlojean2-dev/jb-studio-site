<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="template-view.css" />
  </head>
  <body>
    <main class="template-page">
      <section class="template-wrap">
        <a class="template-back" href="../index.html#designs">← BACK TO WEBSITE STYLES</a>
        <header class="template-hero">
          <p class="template-kicker">TEMPLATE 01</p>
          <h1 class="template-title">LANDING PAGE</h1>
          <p class="template-subtitle">
            A focused one-page structure for offers, campaigns, products or services.
          </p>
        </header>

        <article class="template-preview">
          <figure class="template-frame">
            <img
              class="template-media"
              src="../assets/templates/landing-page-full.jpg"
              alt="Landing page full design preview"
              onload="this.parentElement.classList.add('has-media')"
              onerror="this.remove()"
            />
            <!-- Replace this img with a video if needed:
            <video class="template-media" src="../assets/templates/landing-page-full.mp4" muted autoplay loop playsinline></video>
            -->
            <figcaption class="template-placeholder">FULL DESIGN PREVIEW</figcaption>
          </figure>
          <div class="template-actions">
            <a class="template-request" href="../index.html#contact">REQUEST THIS TEMPLATE →</a>
          </div>
        </article>
      </section>
    </main>
    <script src="template-view.js"></script>
  </body>
</html>
