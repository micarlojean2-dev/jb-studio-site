<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agency Landing Page Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="template-view.css" />
  </head>
  <body>
    <main
      class="template-page"
      data-template-image="../assets/designs/landing-page-01.png"
      data-template-video="../assets/template-videos/landing-page-01.mp4"
    >
      <section class="template-wrap">
        <a class="template-back" href="../index.html#designs">← BACK TO TEMPLATES</a>
        <header class="template-hero">
          <p class="template-kicker">TEMPLATE 01</p>
          <h1 class="template-title">AGENCY LANDING PAGE</h1>
          <p class="template-subtitle">
            A complete landing page style for agencies, campaigns and service offers.
          </p>
        </header>

        <article class="template-preview">
          <figure class="template-frame template-frame-image">
            <img
              class="template-media"
              src="../assets/designs/landing-page-01.png"
              alt="Agency landing page full design preview"
              onload="this.parentElement.classList.add('has-media')"
              onerror="this.remove()"
            />
            <!-- Future video option:
            <video src="../assets/template-videos/landing-page-01.mp4" muted autoplay loop playsinline controls></video>
            -->
            <figcaption class="template-placeholder">IMAGE PREVIEW</figcaption>
          </figure>
          <div class="template-actions">
            <button class="template-expand" type="button" data-expand-preview>EXPAND PREVIEW ↗</button>
            <a class="template-request" href="../index.html#contact">REQUEST THIS TEMPLATE →</a>
          </div>
        </article>
      </section>
    </main>

    <script src="template-view.js"></script>
  </body>
</html>
