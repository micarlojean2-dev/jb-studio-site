<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Business Landing Page Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="template-view.css" />
  </head>
  <body>
    <main class="template-page">
      <section class="template-wrap">
        <a class="template-back" href="../index.html#designs">← BACK TO TEMPLATES</a>
        <header class="template-hero">
          <p class="template-kicker">TEMPLATE 03</p>
          <h1 class="template-title">LOCAL BUSINESS LANDING PAGE</h1>
          <p class="template-subtitle">
            A clean structure for local businesses that need more calls and leads.
          </p>
        </header>

        <article class="template-preview">
          <figure class="template-frame">
            <video
              class="template-media"
              src="../assets/template-videos/landing-page-03.mp4"
              muted
              autoplay
              loop
              playsinline
              controls
              onloadeddata="this.parentElement.classList.add('has-media')"
              onerror="this.remove()"
            ></video>
            <figcaption class="template-placeholder">VIDEO PREVIEW</figcaption>
          </figure>
          <div class="template-actions">
            <a class="template-request" href="../index.html#contact">REQUEST THIS TEMPLATE →</a>
          </div>
        </article>
      </section>
    </main>
    <script src="template-view.js"></script>
  </body>
</html>
