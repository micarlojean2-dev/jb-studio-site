<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Asistente de Ventas — JB Studio</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #0f2b1e;
      --green-main:   #1f5a3b;
      --green-soft:   #4a8b66;
      --cream:        #f5f0e4;
      --cream-soft:   #fbf8f1;
      --cream-deep:   #e9dfcf;
      --border-card:  rgba(25,61,43,0.14);
      --border-inner: rgba(25,61,43,0.10);
      --text:         #173323;
      --text-muted:   #5c6f63;
      --radius-card:  28px;
      --radius:       20px;
      --radius-sm:    12px;
    }

    html {
      height: 100%;
      height: 100dvh;
    }

    body {
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      color: var(--text);
      background: var(--green-dark);
      background-image:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(255,255,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 55% 40% at 100% 100%, rgba(74,139,102,0.18) 0%, transparent 55%);
      overflow: hidden;
    }

    #app {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      min-height: 75dvh;
      align-items: center;
    }

    #chat-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: min(78dvh, 920px);
      border-radius: 36px;
      overflow: hidden;
      background: var(--cream);
      border: 1px solid var(--border-card);
      box-shadow:
        0 24px 70px rgba(5,15,10,0.28),
        0 0 0 1px rgba(255,255,255,0.08),
        0 0 40px rgba(74,139,102,0.10);
      position: relative;
    }

    #chat-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(74,139,102,0.10) 30%, rgba(255,255,255,0.70) 50%, rgba(74,139,102,0.10) 70%, transparent 100%);
      pointer-events: none;
      z-index: 10;
      border-radius: 36px 36px 0 0;
    }

    #header {
      flex: 0 0 auto;
      background: rgba(245,240,228,0.88);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-inner);
      position: relative;
      backdrop-filter: blur(14px);
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1f5a3b 0%, #3f7c59 100%);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 6px 14px rgba(31,90,59,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .header-meta {
      min-width: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-pitch {
      text-align: right;
      flex-shrink: 0;
    }

    .header-pitch-top {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 14px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green-dark);
      white-space: nowrap;
    }

    .header-pitch-top span {
      color: var(--green-main);
    }

    .header-pitch-bottom {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.2;
      white-space: nowrap;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: #2f8a57;
      border-radius: 50%;
      flex-shrink: 0;
      animation: ping 2.2s ease-in-out infinite;
    }

    @keyframes ping {
      0%, 100% { box-shadow: 0 0 0 0 rgba(47,138,87,0.40); opacity: 1; }
      60% { box-shadow: 0 0 0 5px rgba(47,138,87,0); opacity: 0.8; }
    }

    #trust-bar {
      display: none;
    }

    #messages {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 22px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
      background: linear-gradient(180deg, var(--cream-soft) 0%, var(--cream) 100%);
    }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.15); border-radius: 3px; }

    .bubble-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1f5a3b, #4a8b66);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 10px rgba(31,90,59,0.18);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 1px;
    }

    .bubble {
      max-width: min(75%, 520px);
      padding: 13px 17px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.68;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-row.bot .bubble {
      background: var(--cream-soft);
      color: var(--text);
      border: 1px solid rgba(74,139,102,0.18);
      border-bottom-left-radius: 5px;
      box-shadow: 0 6px 16px rgba(18,44,31,0.06);
    }

    .bubble-row.user .bubble {
      background: var(--green-dark);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-right-radius: 5px;
      box-shadow: 0 8px 20px rgba(15,43,30,0.22);
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 0 10px 40px;
      animation: fadeUp 0.25s ease-out 0.1s both;
    }

    .qr-btn {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(74,139,102,0.18);
      color: var(--green-main);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
      letter-spacing: 0.1px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(15,43,30,0.06);
    }

    .qr-btn:hover {
      background: var(--green-main);
      border-color: rgba(31,90,59,0.45);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(31,90,59,0.22);
    }

    .qr-btn:active { transform: scale(0.98); }

    #typing {
      display: none;
      align-items: flex-end;
      gap: 10px;
      padding: 0 18px 6px;
    }

    #typing.visible { display: flex; }

    .typing-bubble {
      background: var(--cream-soft);
      border: 1px solid rgba(74,139,102,0.14);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      padding: 13px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
      box-shadow: 0 6px 16px rgba(18,44,31,0.06);
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;
      background: rgba(31,90,59,0.45);
      border-radius: 50%;
      animation: bounce 1.3s ease-in-out infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .cta-card {
      background: #f0f7f2;
      border: 1px solid rgba(74,139,102,0.18);
      border-radius: var(--radius);
      padding: 18px;
      margin: 8px 0 6px;
      box-shadow: 0 10px 24px rgba(18,44,31,0.08);
    }

    .cta-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.55;
    }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      background: var(--green-main);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 12px 24px rgba(31,90,59,0.22);
      letter-spacing: -0.1px;
    }

    .btn-whatsapp:hover  { opacity: 0.92; }
    .btn-whatsapp:active { transform: scale(0.98); }
    .btn-whatsapp svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }

    #input-area {
      flex: 0 0 auto;
      background: rgba(245,240,228,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-inner);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #msg-input {
      flex: 1;
      background: #fffdf8;
      border: 1px solid rgba(74,139,102,0.16);
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 15px;
      color: var(--text);
      resize: none;
      max-height: 120px;
      min-height: 44px;
      line-height: 1.5;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 2px 8px rgba(15,43,30,0.04);
    }

    #msg-input:focus {
      border-color: rgba(74,139,102,0.45);
      box-shadow: inset 0 2px 8px rgba(15,43,30,0.04), 0 0 0 3px rgba(74,139,102,0.10);
    }

    #msg-input::placeholder { color: #789180; }
    #msg-input:disabled { opacity: 0.35; }

    #send-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1f5a3b 0%, #306f4a 100%);
      border: 1px solid rgba(31,90,59,0.15);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 10px 20px rgba(31,90,59,0.24);
    }

    #send-btn:hover  {
      box-shadow: 0 12px 24px rgba(31,90,59,0.30);
      opacity: 0.92;
    }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; box-shadow: none; }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .limit-notice {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 10px 16px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 600px) {
      body { align-items: stretch; padding: 0; }
      #app { max-width: none; min-height: 100dvh; }
      #chat-shell { min-height: 100dvh; border-radius: 0; }
      .header-info { gap: 10px; }
      .header-pitch-top { font-size: 12px; }
      .header-pitch-bottom { font-size: 10px; }
      #messages { padding: 18px 14px 10px; }
      .quick-replies { padding-left: 0; }
    }

    @media (max-width: 430px) {
      .header-pitch {
        max-width: 140px;
      }
      .header-pitch-bottom {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="chat-shell">
    <div id="header">
      <div class="header-avatar">A</div>
      <div class="header-info">
        <div class="header-meta">
          <div class="header-title">Alex — Asistente JB Studio</div>
          <div class="header-sub">
            <span class="online-dot"></span>
            En línea 24/7
          </div>
        </div>
        <div class="header-pitch">
          <div class="header-pitch-top">SOY ASISTENTE DE <span>JB STUDIO</span></div>
          <div class="header-pitch-bottom">Gestiono tu negocio 24/7 a tu manera.</div>
        </div>
      </div>
    </div>

    <div id="messages"></div>

    <div id="typing">
      <div class="avatar">A</div>
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="input-area">
      <div class="input-row">
        <textarea id="msg-input" placeholder="Escribí tu mensaje aquí..." rows="1"></textarea>
        <button id="send-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
