<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asistente virtual</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* El fondo es telón, no lienzo: la conversación vive en la tarjeta.
       Antes la página entera era el chat y por eso parecía una plantilla. */
    body {
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #16181d;
      letter-spacing: -0.01em;
      background:
        radial-gradient(1100px 620px at 78% 12%, var(--a-glow, rgba(26,74,46,.16)), transparent 60%),
        radial-gradient(900px 560px at 12% 88%, rgba(0,0,0,.05), transparent 62%),
        #eef0f3;
    }

    /* ── Tarjeta flotante ───────────────────────────────────────────────── */
    #a-app {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 400px;
      height: 620px;
      max-height: calc(100dvh - 48px);
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 28px 80px rgba(0,0,0,.20),
        0 10px 28px rgba(0,0,0,.10),
        0 0 0 1px rgba(0,0,0,.05);
      animation: a-rise .42s cubic-bezier(.22,1,.36,1);
    }
    @keyframes a-rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #a-head {
      flex-shrink: 0;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    #a-av {
      width: 42px; height: 42px; border-radius: 13px;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      overflow: hidden;
    }
    #a-name { font-size: 16px; font-weight: 650; line-height: 1.25; }
    #a-status { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 3px; display: flex; align-items: center; gap: 5px; font-weight: 500; }
    .a-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; box-shadow: 0 0 0 3px rgba(74,222,128,.22); }

    /* ── Message list ───────────────────────────────────────────────────── */
    #a-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fafafa;
      -webkit-overflow-scrolling: touch;
    }
    #a-msgs::-webkit-scrollbar { width: 5px; }
    #a-msgs::-webkit-scrollbar-thumb { background: rgba(0,0,0,.13); border-radius: 3px; }
    .a-r { display: flex; align-items: flex-end; gap: 8px; }
    .a-r.a-u { justify-content: flex-end; }
    .a-b {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      animation: a-in .26s cubic-bezier(.22,1,.36,1);
    }
    @keyframes a-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .a-r.a-bot .a-b {
      background: #fff; color: #16181d; border-radius: 18px 18px 18px 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    }
    .a-r.a-u .a-b { color: #fff; border-radius: 18px 18px 5px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.10); }
    .a-ba { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; color: #fff; }

    /* Tres puntos que rebotan de verdad, en vez de "···" fijo */
    .a-ty {
      background: #fff; border-radius: 18px 18px 18px 5px; padding: 14px;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    }
    .a-ty i { width: 7px; height: 7px; border-radius: 50%; background: #c4c8ce; display: block; animation: a-bounce 1.3s ease-in-out infinite; }
    .a-ty i:nth-child(2) { animation-delay: .16s; }
    .a-ty i:nth-child(3) { animation-delay: .32s; }
    @keyframes a-bounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .a-b, #a-app { animation: none; }
      .a-ty i { animation: none; }
    }

    /* ── Menu carousel ──────────────────────────────────────────────────── */
    .a-cards-wrap { width: 100%; overflow-x: auto; padding: 2px 0 4px; -webkit-overflow-scrolling: touch; }
    .a-cards { display: flex; gap: 10px; padding: 0 2px 8px; }
    .a-card {
      flex: 0 0 152px; background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06);
      transition: transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s;
    }
    .a-card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 12px 28px rgba(0,0,0,.10); }
    .a-card-img { width: 100%; height: 92px; object-fit: cover; display: block; background: #f2f2f4; }
    .a-card-ph { width: 100%; height: 92px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .a-card-body { padding: 9px 10px 11px; }
    .a-card-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .a-card-price { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .a-card-desc { font-size: 11.5px; color: #666; line-height: 1.4; }

    /* ── Footer / input ─────────────────────────────────────────────────── */
    #a-foot {
      flex-shrink: 0;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid rgba(0,0,0,.06);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #a-inp {
      flex: 1;
      border: 1.5px solid transparent;
      border-radius: 24px;
      padding: 12px 16px;
      font-size: 16px; /* evita el zoom automático de iOS */
      min-height: 44px;
      outline: none;
      background: #f2f3f5;
      color: #16181d;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    #a-inp:focus { border-color: rgba(0,0,0,.10); background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    #a-inp::placeholder { color: #a8acb3; }
    #a-inp:disabled { opacity: .5; }
    #a-snd {
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff;
    }
    #a-snd:disabled { opacity: .4; cursor: not-allowed; }
    #a-snd svg { width: 18px; height: 18px; }

    /* ── Loading / error states ────────────────────────────────────────── */
    /* El body ya no es flex (ahora es el telón), así que estos estados se
       centran por su cuenta en vez de colgar arriba a la izquierda. */
    #a-loading, #a-notfound {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #a-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px 20px;
      text-align: center;
      color: #888;
    }
    .a-spinner {
      width: 30px; height: 30px; border: 3px solid rgba(0,0,0,.1);
      border-top-color: #1a4a2e; border-radius: 50%;
      animation: a-spin .8s linear infinite;
    }
    @keyframes a-spin { to { transform: rotate(360deg); } }
    #a-preview-banner {
    background: #fff4e5;
    color: #8a4b00;
    border-bottom: 1px solid #f0d9b5;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    padding: 8px 12px;
    flex: 0 0 auto;
    line-height: 1.3;
  }
  #a-preview-banner[hidden] { display: none; }

    /* En un móvil una tarjeta pequeña se lee mal: ocupa casi todo, pero
       conservando el aire y las esquinas para que siga siendo una tarjeta. */
    @media (max-width: 600px) {
      #a-app {
        right: 10px; left: 10px; bottom: 10px; top: 10px;
        width: auto; height: auto;
        max-height: none; border-radius: 20px;
      }
    }
    @media (max-height: 720px) and (min-width: 601px) {
      #a-app { height: calc(100dvh - 48px); }
    }
</style>
</head>
<body>

  <div id="a-loading" style="display:flex;flex:1;flex-direction:column;">
    <div id="a-state"><div class="a-spinner"></div><span>Cargando asistente…</span></div>
  </div>

  <div id="a-app" style="display:none;flex:1;flex-direction:column;min-height:0;">
    <div id="a-preview-banner" hidden>MODO DE PRUEBA — El cliente todavía no ha pagado</div>
    <div id="a-head">
      <div id="a-av">✦</div>
      <div>
        <div id="a-name">Asistente</div>
        <div id="a-status"><span class="a-dot"></span><span id="a-status-text">En línea</span></div>
      </div>
    </div>
    <div id="a-msgs"></div>
    <div id="a-foot">
      <input id="a-inp" type="text" placeholder="Escribe un mensaje…" />
      <button id="a-snd" disabled aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="a-notfound" style="display:none;flex:1;">
    <div id="a-state">
      <div style="font-size:44px;">🔎</div>
      <div style="font-weight:700;color:#333;">Asistente no encontrado</div>
      <div style="max-width:320px;font-size:13.5px;">Este enlace no corresponde a ningún negocio activo en JB Studio.</div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // Fase 4.2: el id se resuelve desde ?id= o desde el pathname, para no
  // depender de una única configuración de Vercel. El rewrite de
  // /asistente/:id es interno (el navegador sigue mostrando la URL bonita),
  // así que en producción gana la rama del pathname; ?id= cubre el acceso
  // directo a /asistente.html?id=... y cualquier despliegue sin rewrites.
  // Solo se aceptan minúsculas, números y guiones — igual que el id que
  // valida api/clients.js.
  function resolveClientId() {
    var fromQuery = '';
    try {
      fromQuery = new URLSearchParams(window.location.search).get('id') || '';
    } catch (e) {
      fromQuery = '';
    }
    if (fromQuery) return sanitizeId(fromQuery);

    // /asistente/{id} → ['asistente', '{id}']
    var parts = window.location.pathname.split('/').filter(Boolean);
    var idx   = parts.indexOf('asistente');
    var seg   = idx !== -1 ? (parts[idx + 1] || '') : (parts[1] || '');
    return sanitizeId(seg);
  }

  function sanitizeId(raw) {
    var v = String(raw || '').trim().toLowerCase();
    return /^[a-z0-9-]{1,80}$/.test(v) ? v : '';
  }

  var clientId = resolveClientId();

  // Token de vista previa del admin: permite conversar con un chatbot que
  // todavía no ha pagado. Es temporal (15 min), server-side y sirve solo para
  // este cliente. No es el ADMIN_TOKEN y no activa nada.
  var previewToken = (function () {
    try {
      var t = new URLSearchParams(window.location.search).get('preview') || '';
      return /^[a-f0-9]{64}$/.test(t) ? t : '';
    } catch (e) { return ''; }
  })();

  var API = window.location.origin;

  var loadingEl  = document.getElementById('a-loading');
  var appEl      = document.getElementById('a-app');
  var notfoundEl = document.getElementById('a-notfound');

  if (!clientId) {
    loadingEl.style.display = 'none';
    notfoundEl.style.display = 'flex';
    return;
  }

  if (previewToken) {
    var pb = document.getElementById('a-preview-banner');
    if (pb) pb.hidden = false;
  }

  var SESS = 'jba_' + clientId;
  var cfg  = { businessName: 'Asistente', color: '#1a4a2e', language: 'es', active: true };
  var msgs = [];
  var busy = false;

  // Feature gating — same "!== false" backward-compatible pattern as
  // widget.js (legacy clients with no cfg.features keep everything on).
  // Keep this in sync with widget.js's featureOn() — no shared module in
  // this vanilla codebase to dedupe against.
  function featureOn(key) {
    return !cfg.features || cfg.features[key] !== false;
  }

  var bookingStep = 0, bookingData = {};
  var cancelStep  = 0, cancelData  = {};

  var CANCEL_TRIGGERS  = /\bcancel(ar)?\b|quiero cancelar/i;
  var BOOKING_TRIGGERS = /reservar|agendar|cita|quiero ir|disponibilidad|appointment|reserva|hora libre|turno|quiero una cita/i;

  var BOOKING_STEPS = [
    { field: 'nombre',   ask: { es: '¿Cuál es tu nombre completo?',                           en: 'What is your full name?' } },
    { field: 'telefono', ask: { es: '¿Cuál es tu número de teléfono?',                        en: "What's your phone number?" } },
    { field: 'email',    ask: { es: '¿Cuál es tu email?',                                     en: "What's your email address?" } },
    { field: 'fecha',    ask: { es: '¿Qué fecha prefieres? (ej: 15 de julio)',                 en: 'What date do you prefer? (e.g. July 15)' } },
    { field: 'hora',     ask: { es: '¿A qué hora? (ej: 3:00 PM)',                             en: 'What time? (e.g. 3:00 PM)' } },
    { field: 'servicio', ask: { es: '¿Qué servicio deseas o para cuántas personas?',           en: 'What service do you need, or how many people?' } },
    { field: 'nota',     ask: { es: '¿Alguna nota adicional? (escribe "no" si no tienes ninguna)', en: 'Any additional notes? (write "no" if none)' } },
  ];
  var CANCEL_STEPS = [
    { field: 'contacto', ask: { es: '¿Cuál es el email o teléfono con el que hiciste la reserva?', en: 'What email or phone number did you use to book?' } },
    { field: 'fecha',    ask: { es: '¿Cuál es la fecha de tu reserva? (ej: 15 de julio)',           en: 'What is the date of your reservation? (e.g. July 15)' } },
  ];

  try { msgs = JSON.parse(sessionStorage.getItem(SESS) || '[]'); } catch (e) { msgs = []; }
  function save() { try { sessionStorage.setItem(SESS, JSON.stringify(msgs.slice(-40))); } catch (e) {} }

  var msgsEl = document.getElementById('a-msgs');
  var inp    = document.getElementById('a-inp');
  var snd    = document.getElementById('a-snd');
  var nameEl = document.getElementById('a-name');
  var avEl   = document.getElementById('a-av');
  var headEl = document.getElementById('a-head');
  var statusText = document.getElementById('a-status-text');

  // Halo del fondo con el color del negocio, translúcido. Si el color no es
  // un hex válido caemos al verde de marca en vez de romper el degradado.
  function hexToRgba(hex, a) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex || '').trim());
    if (!m) return 'rgba(26,74,46,' + a + ')';
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')';
  }

  // Inicial del negocio como logo. Mejor una letra propia que un ✦ genérico.
  function initials(name) {
    var w = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '✦';
    return (w.length === 1 ? w[0].slice(0, 1) : w[0][0] + w[1][0]).toUpperCase();
  }

  function paint() {
    var c = cfg.color;
    // El fondo lo define el CSS; aquí solo se tiñe el halo.
    document.documentElement.style.setProperty('--a-glow', hexToRgba(c, 0.18));
    headEl.style.background = c;
    snd.style.background    = c;
    avEl.textContent        = initials(cfg.businessName);
    nameEl.textContent      = cfg.businessName || 'Asistente';
    document.title          = (cfg.businessName || 'Asistente') + ' — Chat';
    inp.placeholder = cfg.language === 'en' ? 'Type a message…' : 'Escribe un mensaje…';
    statusText.textContent  = cfg.language === 'en' ? 'Online now' : 'En línea';
    var ubs = msgsEl.querySelectorAll('.a-r.a-u .a-b');
    for (var i = 0; i < ubs.length; i++) ubs[i].style.background = c;
    var avs = msgsEl.querySelectorAll('.a-ba');
    for (var j = 0; j < avs.length; j++) avs[j].style.background = c;
  }

  function addMsg(role, text) {
    var row = document.createElement('div');
    row.className = 'a-r ' + (role === 'user' ? 'a-u' : 'a-bot');
    var bub = document.createElement('div');
    bub.className = 'a-b';
    bub.textContent = text;
    if (role === 'bot') {
      var av = document.createElement('div');
      av.className = 'a-ba';
      av.style.background = cfg.color;
      av.textContent = '✦';
      row.appendChild(av);
    } else {
      bub.style.background = cfg.color;
    }
    row.appendChild(bub);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function showTyping() {
    var row = document.createElement('div');
    row.className = 'a-r a-bot';
    row.id = 'a-ty';
    var av = document.createElement('div');
    av.className = 'a-ba';
    av.style.background = cfg.color;
    av.textContent = '✦';
    var b = document.createElement('div');
    b.className = 'a-ty';
    b.innerHTML = '<i></i><i></i><i></i>';
    row.appendChild(av);
    row.appendChild(b);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function hideTyping() {
    var el = document.getElementById('a-ty');
    if (el) el.remove();
  }

  function renderMenu() {
    var items = Array.isArray(cfg.menu) ? cfg.menu : [];
    if (!items.length) return;
    var wrap = document.createElement('div');
    wrap.className = 'a-cards-wrap';
    var row = document.createElement('div');
    row.className = 'a-cards';
    items.forEach(function (item) {
      var card = document.createElement('div');
      card.className = 'a-card';
      if (item.imagen) {
        var img = document.createElement('img');
        img.className = 'a-card-img';
        img.src = item.imagen;
        img.alt = item.nombre || '';
        img.loading = 'lazy';
        img.onerror = function () {
          var ph = document.createElement('div');
          ph.className = 'a-card-ph';
          ph.textContent = '🖼';
          img.parentNode.replaceChild(ph, img);
        };
        card.appendChild(img);
      } else {
        var ph = document.createElement('div');
        ph.className = 'a-card-ph';
        ph.textContent = '🖼';
        card.appendChild(ph);
      }
      var body = document.createElement('div');
      body.className = 'a-card-body';
      if (item.nombre) {
        var name = document.createElement('div');
        name.className = 'a-card-name';
        name.textContent = item.nombre;
        body.appendChild(name);
      }
      if (item.precio) {
        var price = document.createElement('div');
        price.className = 'a-card-price';
        price.style.color = cfg.color;
        price.textContent = item.precio;
        body.appendChild(price);
      }
      if (item.descripcion) {
        var desc = document.createElement('div');
        desc.className = 'a-card-desc';
        desc.textContent = item.descripcion;
        body.appendChild(desc);
      }
      card.appendChild(body);
      row.appendChild(card);
    });
    wrap.appendChild(row);
    msgsEl.appendChild(wrap);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function submitBooking() {
    var lang = cfg.language === 'en' ? 'en' : 'es';
    busy = true; inp.disabled = true; snd.disabled = true;
    showTyping();
    fetch(API + '/api/reservations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ clientId: clientId }, bookingData)),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        hideTyping();
        addMsg('bot', d.ok
          ? (lang === 'en' ? '✅ Your request has been received! The business will review availability and confirm with you soon.' : '✅ Tu solicitud fue recibida. El negocio revisará disponibilidad y te confirmará pronto.')
          : (lang === 'en' ? 'There was an error saving your request. Please try again.' : 'Hubo un error al guardar tu solicitud. Por favor intenta de nuevo.'));
      })
      .catch(function () {
        hideTyping();
        addMsg('bot', lang === 'en' ? 'Connection error. Please try again.' : 'Error de conexión. Por favor intenta de nuevo.');
      })
      .finally(function () {
        bookingStep = 0; bookingData = {};
        busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
      });
  }

  function submitCancellation() {
    var lang = cfg.language === 'en' ? 'en' : 'es';
    busy = true; inp.disabled = true; snd.disabled = true;
    showTyping();
    fetch(API + '/api/cancel-reservation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: clientId, contacto: cancelData.contacto, fecha: cancelData.fecha }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        hideTyping();
        addMsg('bot', d.found
          ? (lang === 'en' ? '✅ Your reservation has been cancelled. We hope to see you again soon!' : '✅ Tu reserva fue cancelada correctamente. ¡Esperamos verte pronto!')
          : (lang === 'en' ? 'No reservation was found with those details. Please verify your email/phone and date, then try again.' : 'No encontramos una reserva con esos datos. Verifica el email/teléfono y la fecha e intenta de nuevo.'));
      })
      .catch(function () {
        hideTyping();
        addMsg('bot', lang === 'en' ? 'Connection error. Please try again.' : 'Error de conexión. Por favor intenta de nuevo.');
      })
      .finally(function () {
        cancelStep = 0; cancelData = {};
        busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
      });
  }

  function send(text) {
    if (busy || !text.trim()) return;
    var t = text.trim();
    var lang = cfg.language === 'en' ? 'en' : 'es';

    if (cancelStep > 0) {
      if (/^(salir|exit)$/i.test(t)) {
        cancelStep = 0; cancelData = {};
        addMsg('user', t);
        addMsg('bot', lang === 'en' ? 'Process cancelled. Is there anything else I can help with?' : 'Proceso cancelado. ¿Hay algo más en lo que pueda ayudarte?');
        return;
      }
      var cstep = CANCEL_STEPS[cancelStep - 1];
      cancelData[cstep.field] = t;
      addMsg('user', t);
      cancelStep++;
      if (cancelStep <= CANCEL_STEPS.length) addMsg('bot', CANCEL_STEPS[cancelStep - 1].ask[lang]);
      else submitCancellation();
      return;
    }

    if (bookingStep > 0) {
      if (/^(cancelar|cancel|salir|exit)$/i.test(t)) {
        bookingStep = 0; bookingData = {};
        addMsg('user', t);
        addMsg('bot', lang === 'en' ? 'Reservation cancelled. Is there anything else I can help with?' : 'Reserva cancelada. ¿Hay algo más en lo que pueda ayudarte?');
        return;
      }
      var step = BOOKING_STEPS[bookingStep - 1];
      bookingData[step.field] = t;
      addMsg('user', t);
      bookingStep++;
      if (bookingStep <= BOOKING_STEPS.length) addMsg('bot', BOOKING_STEPS[bookingStep - 1].ask[lang]);
      else submitBooking();
      return;
    }

    if (featureOn('cancellation') && CANCEL_TRIGGERS.test(t)) {
      addMsg('user', t);
      cancelStep = 1;
      var cancelIntro = lang === 'en'
        ? '🗓️ I\'ll help you cancel your reservation. Write "exit" at any time to stop.\n\n'
        : '🗓️ Te ayudo a cancelar tu reserva. Escribe "salir" en cualquier momento para salir.\n\n';
      addMsg('bot', cancelIntro + CANCEL_STEPS[0].ask[lang]);
      return;
    }

    if (featureOn('reservations') && BOOKING_TRIGGERS.test(t)) {
      addMsg('user', t);
      msgs.push({ role: 'user', content: t });
      save();
      bookingStep = 1;
      var intro = lang === 'en'
        ? '📅 Sure! I\'ll help you request an appointment. Write "cancel" at any time to stop.\n\n'
        : '📅 ¡Con gusto! Te ayudo a solicitar una cita. Escribe "cancelar" en cualquier momento para salir.\n\n';
      addMsg('bot', intro + BOOKING_STEPS[0].ask[lang]);
      return;
    }

    busy = true; inp.disabled = true; snd.disabled = true;
    addMsg('user', text);
    msgs.push({ role: 'user', content: text });
    save();
    showTyping();

    fetch(API + '/api/client-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(previewToken
        ? { clientId: clientId, messages: msgs, previewToken: previewToken }
        : { clientId: clientId, messages: msgs }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        hideTyping();
        if (d.error === 'inactive') {
          addMsg('bot', d.message || (cfg.language === 'en' ? 'This service is temporarily unavailable.' : 'Este servicio no está disponible temporalmente.'));
        } else if (d.text) {
          var showMenu  = /\[MOSTRAR_MENU\]/.test(d.text);
          var cleanText = d.text.replace(/\[MOSTRAR_MENU\]/g, '').trim();
          if (cleanText) addMsg('bot', cleanText);
          if (showMenu)  renderMenu();
          msgs.push({ role: 'assistant', content: d.text });
          save();
        } else {
          addMsg('bot', cfg.language === 'en' ? 'Something went wrong. Please try again.' : 'Algo salió mal. Por favor intenta de nuevo.');
        }
      })
      .catch(function () {
        hideTyping();
        addMsg('bot', cfg.language === 'en' ? 'Connection error. Please try again.' : 'Error de conexión. Por favor intenta de nuevo.');
      })
      .finally(function () {
        busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
      });
  }

  snd.addEventListener('click', function () {
    var t = inp.value.trim();
    inp.value = '';
    send(t);
  });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var t = inp.value.trim();
      inp.value = '';
      send(t);
    }
  });

  // ── Load client config, then show the chat ──────────────────────────────
  fetch(API + '/api/client-config?id=' + encodeURIComponent(clientId))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) {
        loadingEl.style.display = 'none';
        notfoundEl.style.display = 'flex';
        return;
      }
      Object.assign(cfg, d);
      loadingEl.style.display = 'none';
      appEl.style.display = 'flex';
      paint();
      snd.disabled = false;

      msgs.forEach(function (m) { addMsg(m.role === 'user' ? 'user' : 'bot', m.content); });
      if (!msgs.length) {
        var g = cfg.language === 'en' ? "Hi! 👋 How can I help you today?" : "¡Hola! 👋 ¿En qué puedo ayudarte hoy?";
        addMsg('bot', g);
        msgs.push({ role: 'assistant', content: g });
        save();
      }
      setTimeout(function () { inp.focus(); }, 200);
    })
    .catch(function () {
      loadingEl.style.display = 'none';
      notfoundEl.style.display = 'flex';
    });

})();
</script>
</body>
</html>
