<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/sentry-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asistente virtual</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* El fondo es telón, no lienzo: la conversación vive en la tarjeta.
       Antes la página entera era el chat y por eso parecía una plantilla. */
    body {
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #16181d;
      letter-spacing: -0.01em;
      background:
        radial-gradient(1100px 620px at 78% 12%, var(--a-glow, rgba(26,74,46,.16)), transparent 60%),
        radial-gradient(900px 560px at 12% 88%, rgba(0,0,0,.05), transparent 62%),
        #eef0f3;
    }

    /* ── Tarjeta flotante ───────────────────────────────────────────────── */
    #a-app {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 400px;
      height: 620px;
      max-height: calc(100dvh - 48px);
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 28px 80px rgba(0,0,0,.20),
        0 10px 28px rgba(0,0,0,.10),
        0 0 0 1px rgba(0,0,0,.05);
      animation: a-rise .42s cubic-bezier(.22,1,.36,1);
    }
    @keyframes a-rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #a-head {
      flex-shrink: 0;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    #a-av {
      width: 42px; height: 42px; border-radius: 13px;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      overflow: hidden;
    }
    #a-name { font-size: 16px; font-weight: 650; line-height: 1.25; }
    #a-status { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 3px; display: flex; align-items: center; gap: 5px; font-weight: 500; }
    #a-version { font-size: 10px; color: rgba(255,255,255,.62); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #a-version[hidden] { display: none; }
    .a-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; box-shadow: 0 0 0 3px rgba(74,222,128,.22); }

    /* ── Message list ───────────────────────────────────────────────────── */
    #a-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fafafa;
      -webkit-overflow-scrolling: touch;
    }
    #a-msgs::-webkit-scrollbar { width: 5px; }
    #a-msgs::-webkit-scrollbar-thumb { background: rgba(0,0,0,.13); border-radius: 3px; }
    .a-r { display: flex; align-items: flex-end; gap: 8px; }
    .a-r.a-u { justify-content: flex-end; }
    .a-b {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      animation: a-in .26s cubic-bezier(.22,1,.36,1);
    }
    @keyframes a-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .a-r.a-bot .a-b {
      background: #fff; color: #16181d; border-radius: 18px 18px 18px 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    }
    .a-r.a-u .a-b { color: #fff; border-radius: 18px 18px 5px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.10); }
    .a-ba { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; color: #fff; }

    /* Tres puntos que rebotan de verdad, en vez de "···" fijo */
    .a-ty {
      background: #fff; border-radius: 18px 18px 18px 5px; padding: 14px;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    }
    .a-ty i { width: 7px; height: 7px; border-radius: 50%; background: #c4c8ce; display: block; animation: a-bounce 1.3s ease-in-out infinite; }
    .a-ty i:nth-child(2) { animation-delay: .16s; }
    .a-ty i:nth-child(3) { animation-delay: .32s; }
    @keyframes a-bounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .a-b, #a-app { animation: none; }
      .a-ty i { animation: none; }
    }

    /* ── Menu carousel ──────────────────────────────────────────────────── */
    /* Tarjetas verticales dentro del hilo, como recomendación del asistente.
       Rejilla de 2 columnas: entran más sin arrastrar y sin ocupar la pantalla. */
    .a-cards-wrap { width: 100%; padding: 2px 0 4px; }
    .a-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 0 0 4px; }
    .a-card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 2px; width: 100%; font-family: inherit; cursor: pointer;
      background: #fff; border: 1.5px solid rgba(0,0,0,.06); border-radius: 18px;
      padding: 16px 12px 14px; min-height: 176px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
      transition: transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s, border-color .18s;
      opacity: 0; animation: a-card-in .34s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes a-card-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
    .a-card:hover { transform: translateY(-3px); border-color: rgba(0,0,0,.10); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 12px 28px rgba(0,0,0,.10); }
    .a-card:active { transform: translateY(-1px) scale(.97); }
    .a-card-ico {
      width: 54px; height: 54px; border-radius: 16px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .a-card-img { width: 100px; height: 100px; border-radius: 16px; object-fit: cover; margin-bottom: 10px; display: block; background: #f2f2f4; }
    .a-card-no-image { justify-content: center; min-height: 100px; padding: 18px 12px; }
    .a-card-name { font-size: 13.5px; font-weight: 650; line-height: 1.3; }
    .a-card-price { font-size: 15px; font-weight: 700; margin-top: 4px; }
    .a-card-badge {
      font-size: 10.5px; font-weight: 600; margin-top: 5px;
      padding: 3px 8px; border-radius: 20px; background: #fff5e0; color: #8a5a00;
    }
    .a-card-desc { font-size: 11.5px; color: #6b6f76; line-height: 1.4; margin-top: 6px; }
    .a-card-cta { font-size: 11.5px; font-weight: 700; margin-top: 8px; }
    .a-gallery-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #8a8f98; margin: 2px 0 8px; }
    .a-gallery { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 4px 0; }
    .a-gallery-card { overflow: hidden; border: 1px solid rgba(0,0,0,.07); border-radius: 12px; background: #fff; }
    .a-gallery-card img { width: 100%; aspect-ratio: 1.35; object-fit: cover; display: block; background: #f2f2f4; }
    .a-gallery-copy { padding: 8px 9px 9px; }
    .a-gallery-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; }
    .a-gallery-meta { margin-top: 3px; color: #6b6f76; font-size: 11.5px; line-height: 1.3; }
    .a-gallery-more { border: 0; background: none; color: var(--a-accent, #1a4a2e); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 0; }

    /* Botones de inicio */
    .a-quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 2px 36px; }
    .a-quick-btn {
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      background: #fff; border: 1.5px solid rgba(0,0,0,.08); border-radius: 20px;
      padding: 9px 14px; color: #16181d; min-height: 38px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 3px 10px rgba(0,0,0,.04);
      transition: transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s, border-color .16s;
      opacity: 0; animation: a-card-in .3s cubic-bezier(.22,1,.36,1) forwards;
    }
    .a-quick-btn:hover { transform: translateY(-2px); border-color: rgba(0,0,0,.14); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 8px 20px rgba(0,0,0,.08); }
    .a-quick-btn:active { transform: translateY(0) scale(.98); }
    @media (prefers-reduced-motion: reduce) { .a-quick-btn { animation: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .a-card { animation: none; opacity: 1; } }

    /* ── Footer / input ─────────────────────────────────────────────────── */
    #a-foot {
      flex-shrink: 0;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid rgba(0,0,0,.06);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #a-inp {
      flex: 1;
      border: 1.5px solid transparent;
      border-radius: 24px;
      padding: 12px 16px;
      font-size: 16px; /* evita el zoom automático de iOS */
      min-height: 44px;
      outline: none;
      background: #f2f3f5;
      color: #16181d;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    #a-inp:focus { border-color: rgba(0,0,0,.10); background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    #a-inp::placeholder { color: #a8acb3; }
    #a-inp:disabled { opacity: .5; }
    #a-snd {
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff;
    }
    #a-snd:disabled { opacity: .4; cursor: not-allowed; }
    #a-snd svg { width: 18px; height: 18px; }

    /* ── Loading / error states ────────────────────────────────────────── */
    /* El body ya no es flex (ahora es el telón), así que estos estados se
       centran por su cuenta en vez de colgar arriba a la izquierda. */
    #a-loading, #a-notfound {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #a-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px 20px;
      text-align: center;
      color: #888;
    }
    .a-spinner {
      width: 30px; height: 30px; border: 3px solid rgba(0,0,0,.1);
      border-top-color: #1a4a2e; border-radius: 50%;
      animation: a-spin .8s linear infinite;
    }
    @keyframes a-spin { to { transform: rotate(360deg); } }
    #a-preview-banner {
    background: #fff4e5;
    color: #8a4b00;
    border-bottom: 1px solid #f0d9b5;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    padding: 8px 12px;
    flex: 0 0 auto;
    line-height: 1.3;
  }
  #a-preview-banner[hidden] { display: none; }

    /* En un móvil una tarjeta pequeña se lee mal: ocupa casi todo, pero
       conservando el aire y las esquinas para que siga siendo una tarjeta. */
    @media (max-width: 600px) {
      #a-app {
        right: 10px; left: 10px; bottom: 10px; top: 10px;
        width: auto; height: auto;
        max-height: none; border-radius: 20px;
      }
    }
    @media (max-height: 720px) and (min-width: 601px) {
      #a-app { height: calc(100dvh - 48px); }
    }
</style>
</head>
<body data-sentry-page="chatbot_loader">

  <div id="a-loading" style="display:flex;flex:1;flex-direction:column;">
    <div id="a-state"><div class="a-spinner"></div><span>Cargando asistente…</span></div>
  </div>

  <div id="a-app" style="display:none;flex:1;flex-direction:column;min-height:0;">
    <div id="a-preview-banner" hidden>Vista previa — solo tú puedes ver esto</div>
    <div id="a-head">
      <div id="a-av">✦</div>
      <div>
         <div id="a-name">Asistente</div>
         <div id="a-status"><span class="a-dot"></span><span id="a-status-text">En línea</span></div>
         <div id="a-version" hidden></div>
      </div>
    </div>
    <div id="a-msgs"></div>
    <div id="a-foot">
      <input id="a-inp" type="text" placeholder="Escribe un mensaje…" />
      <button id="a-snd" disabled aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="a-notfound" style="display:none;flex:1;">
    <div id="a-state">
      <div style="font-size:44px;">🔎</div>
      <div style="font-weight:700;color:#333;">Asistente no encontrado</div>
      <div style="max-width:320px;font-size:13.5px;">Este enlace no corresponde a ningún negocio activo en JB Studio.</div>
    </div>
  </div>

<script src="/chat-core.js"></script>
<script>
(function () {
  'use strict';

  // Fase 4.2: el id se resuelve desde ?id= o desde el pathname, para no
  // depender de una única configuración de Vercel. El rewrite de
  // /asistente/:id es interno (el navegador sigue mostrando la URL bonita),
  // así que en producción gana la rama del pathname; ?id= cubre el acceso
  // directo a /asistente.html?id=... y cualquier despliegue sin rewrites.
  // Solo se aceptan minúsculas, números y guiones — igual que el id que
  // valida api/clients.js.
  function resolveClientId() {
    var fromQuery = '';
    try {
      fromQuery = new URLSearchParams(window.location.search).get('id') || '';
    } catch (e) {
      fromQuery = '';
    }
    if (fromQuery) return sanitizeId(fromQuery);

    // /asistente/{id} → ['asistente', '{id}']
    var parts = window.location.pathname.split('/').filter(Boolean);
    var idx   = parts.indexOf('asistente');
    var seg   = idx !== -1 ? (parts[idx + 1] || '') : (parts[1] || '');
    return sanitizeId(seg);
  }

  function sanitizeId(raw) {
    var v = String(raw || '').trim().toLowerCase();
    return /^[a-z0-9-]{1,80}$/.test(v) ? v : '';
  }

  var CORE = window.JBChatCore;
  var RESUMEN_ICONOS = CORE.RESUMEN_ICONOS, RESUMEN_LABEL = CORE.RESUMEN_LABEL;
  var BOOKING_STEPS = CORE.BOOKING_STEPS, CANCEL_STEPS = CORE.CANCEL_STEPS;
  var CORRECCION_RE = CORE.CORRECCION_RE, CAMPO_MENCIONADO = CORE.CAMPO_MENCIONADO;

  var clientId = resolveClientId();
  window.__JB_CLIENT_ID__ = clientId;

  // Token de vista previa del admin: permite conversar con un chatbot que
  // todavía no ha pagado. Es temporal (15 min), server-side y sirve solo para
  // este cliente. No es el ADMIN_TOKEN y no activa nada.
  var previewToken = (function () {
    try {
      var t = new URLSearchParams(window.location.search).get('preview') || '';
      return /^[a-f0-9]{64}$/.test(t) ? t : '';
    } catch (e) { return ''; }
  })();

  var API = window.location.origin;

  var loadingEl  = document.getElementById('a-loading');
  var appEl      = document.getElementById('a-app');
  var notfoundEl = document.getElementById('a-notfound');
  var versionEl  = document.getElementById('a-version');

  if (!clientId) {
    loadingEl.style.display = 'none';
    notfoundEl.style.display = 'flex';
    return;
  }

  fetch(API + '/api/build', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !/^(?:dpl_[a-z0-9]+|[a-f0-9]{7,64}|local)$/i.test(d.version)) return;
      versionEl.textContent = 'Versión: ' + d.version.slice(0, 11);
      versionEl.hidden = false;
    })
    .catch(function () {});

  // El banner NO se muestra solo por llevar ?preview= en la URL: cualquiera
  // podría añadir un token inventado a la página pública y leer que el
  // negocio no ha pagado. Se muestra cuando el servidor confirma que el
  // token es válido (client-chat devuelve preview:true).
  function marcarModoPrueba() {
    var pb = document.getElementById('a-preview-banner');
    if (pb) pb.hidden = false;
  }

  var SESS = 'jba_' + clientId;
  var cfg  = { businessName: 'Asistente', color: '#1a4a2e', language: 'es', active: true };
  var msgs = [];
  var busy = false;
  var LANGUAGE_SESS = SESS + '_language';

  // Selector explícito de idioma (Objetivo 1): nunca depende de
  // templateId==='spa' — la única condición real es que el negocio declare
  // ambos idiomas. Una vez elegido, nunca se vuelve a detectar del texto
  // libre. [Objetivo 1, reglas 2 y 7]
  function hasLanguageChoice() { return CORE.hasLanguageChoice(cfg); }
  function storedLanguage() {
    try { var v = sessionStorage.getItem(LANGUAGE_SESS); return (v === 'en' || v === 'es') ? v : ''; } catch (e) { return ''; }
  }
  function setLanguage(lang) {
    cfg.language = lang === 'en' ? 'en' : 'es';
    try { sessionStorage.setItem(LANGUAGE_SESS, cfg.language); } catch (e) {}
  }
  function isCancellationRequest(text) {
    return CANCEL_TRIGGERS.test(text) || (hasLanguageChoice() && /\bi want to cancel my appointment\b/i.test(text));
  }

  // Feature gating — same "!== false" backward-compatible pattern as
  // widget.js (legacy clients with no cfg.features keep everything on).
  // Keep this in sync with widget.js's featureOn() — no shared module in
  // this vanilla codebase to dedupe against.
  function featureOn(key) { return CORE.featureOn(cfg, key); }

  var bookingStep = 0, bookingData = {};
  // Servicio recordado aunque el cliente aún no esté en modo reserva: se fija
  // al mencionarlo en chat libre, al pulsar una tarjeta o al elegirlo del
  // catálogo. Al iniciar una reserva sirve de respaldo si el mensaje que la
  // dispara no vuelve a nombrar el servicio. [Objetivo 4]
  var selectedService = '';
  // Campo que DeepSeek está pidiendo ahora: permite guardar una respuesta
  // escueta ("Mike") en el sitio correcto. Solo para campos de texto libre.
  var bookingPending = null;
   var BARE_OK = { nombre: 1, telefono: 1, email: 1, specialRequests: 1 };
  var bookingReview = false;   // el resumen final está a la vista, esperando confirmación
  var resumenBotones = null;   // botones del resumen activo, para no dejar un par duplicado
  var submitting = false;      // evita envíos duplicados de la reserva
  // Estado de la reserva activa creada en esta conversación. Persiste tras
  // recargar para reconocerla, impedir duplicados y permitir modificar/cancelar
  // por su actionToken (sin depender solo del historial de texto). [BUG-4/5]
  var RESERVA_SESS = SESS + '_reserva';
  var activeReservation = null;
  var dupAttempts = 0;      // intentos de crear otra reserva teniendo una activa
  var spamUntil = 0;        // límite temporal ante insistencia repetida
  var modifyMode = false;   // esperando el dato a cambiar de la reserva activa
  var dupPending = false;   // se ofrecieron los botones Modificar/Cancelar/Mantener; nada de chat libre hasta que se use uno
  var accionesBotones = null;  // botones de la reserva activa, para no dejar un par duplicado
  try { activeReservation = JSON.parse(sessionStorage.getItem(RESERVA_SESS) || 'null'); } catch (e) {}
  function saveReserva() { try {
    if (activeReservation) sessionStorage.setItem(RESERVA_SESS, JSON.stringify(activeReservation));
    else sessionStorage.removeItem(RESERVA_SESS);
  } catch (e) {} }
  var MODIFY_TRIGGERS = CORE.MODIFY_TRIGGERS;   // raíz compartida (arreglo del \b que fallaba con "modificar")

  var emailAction = (function () {
    try {
      var q = new URLSearchParams(window.location.hash.slice(1) || window.location.search);
      var action = q.get('action'), token = q.get('reservation');
      return token && (action === 'cancel' || action === 'reschedule') ? { action: action, token: token } : null;
    } catch (e) { return null; }
  })();

  var CANCEL_TRIGGERS  = /\bcancel(ar)?\b|quiero cancelar/i;
  var BOOKING_TRIGGERS = /reservar|agendar|cita|quiero ir|disponibilidad|appointment|reserva|hora libre|turno|quiero una cita/i;

  try { msgs = JSON.parse(sessionStorage.getItem(SESS) || '[]'); } catch (e) { msgs = []; }
  var BOOKING_SESS = SESS + '_booking';
  try {
    var restoredBooking = JSON.parse(sessionStorage.getItem(BOOKING_SESS) || 'null');
    if (restoredBooking && typeof restoredBooking === 'object') {
      bookingStep = restoredBooking.bookingStep || 0;
      bookingData = restoredBooking.bookingData || {};
      bookingPending = restoredBooking.bookingPending || null;
      bookingReview = !!(restoredBooking.awaitingConfirmation || restoredBooking.bookingReview);
      horaPendiente = restoredBooking.horaPendiente || null;
      selectedService = restoredBooking.selectedService || '';
    }
  } catch (e) {}
  function save() { try {
    sessionStorage.setItem(SESS, JSON.stringify(msgs.slice(-60)));
    if (bookingStep || selectedService) sessionStorage.setItem(BOOKING_SESS, JSON.stringify({ bookingStep: bookingStep, bookingData: bookingData, bookingPending: bookingPending, bookingReview: bookingReview, awaitingConfirmation: bookingReview, horaPendiente: horaPendiente, language: cfg.language, selectedService: selectedService }));
    else sessionStorage.removeItem(BOOKING_SESS);
  } catch (e) {} }

  var msgsEl = document.getElementById('a-msgs');
  var inp    = document.getElementById('a-inp');
  var snd    = document.getElementById('a-snd');
  var nameEl = document.getElementById('a-name');
  var avEl   = document.getElementById('a-av');

  // Halo del fondo con el color del negocio, translúcido. Si el color no es
  // un hex válido caemos al verde de marca en vez de romper el degradado.
  // Inicial del negocio como logo. Mejor una letra propia que un ✦ genérico.
  function initials(name) {
    var w = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '✦';
    return (w.length === 1 ? w[0].slice(0, 1) : w[0][0] + w[1][0]).toUpperCase();
  }

  // al visitante sin saber qué pedir. Las opciones de reserva solo se ofrecen

  function greeting() {
    return CORE.greeting(cfg, featureOn('reservations'));

  // Muestra el saludo normal, ya con cfg.language resuelto. [Objetivo 1]

    var g = greeting();
    addMsg('bot', g);
    msgs.push({ role: 'assistant', content: g });

  // Selector inicial de idioma: antes del saludo, cuando el negocio declara

    var copy = CORE.languageChoiceCopy();
    addMsg('bot', copy.prompt);

    wrap.className = 'a-quick';

      var b = document.createElement('button');

  // Botones de inicio: tocar en vez de escribir. Mandan el mismo texto que
  // escribiría una persona, así que el flujo posterior es idéntico.
  function renderQuickActions() {
    var acciones = CORE.accionesRapidas(cfg, featureOn('reservations'));

  function paint() {

    headEl.style.background = c;

    document.title          = (cfg.businessName || 'Asistente') + ' — Chat';
    inp.placeholder = cfg.language === 'en' ? 'Type a message…' : 'Escribe un mensaje…';
    snd.setAttribute('aria-label', cfg.language === 'en' ? 'Send' : 'Enviar');
    statusText.textContent  = cfg.language === 'en' ? 'Online now' : 'En línea';
    var ubs = msgsEl.querySelectorAll('.a-r.a-u .a-b');
    for (var i = 0; i < ubs.length; i++) ubs[i].style.background = c;
    var avs = msgsEl.querySelectorAll('.a-ba');

  function addMsg(role, text) {
    var row = document.createElement('div');

    var bub = document.createElement('div');
    bub.className = 'a-b';

  // Icono por tipo de servicio. Si no reconoce nada usa un neutro elegante:

  // "Popular" sale del dato del negocio, nunca se inventa: decirle a un
  // cliente real que algo es popular sin que lo sea es una afirmación falsa.
  function renderMenu() {
    var items = Array.isArray(cfg.menu) ? cfg.menu : [];
    if (!items.length) return;

    var wrap = document.createElement('div');
    wrap.className = 'a-cards-wrap';
    var row = document.createElement('div');
    row.className = 'a-cards';

    items.forEach(function (item, idx) {
      var card = document.createElement('button');

      if (item.imagen) {
        var img = document.createElement('img');
        img.className = 'a-card-img';
        img.src = item.imagen;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function () {
          if (img.parentNode) img.parentNode.replaceChild(buildIco(item.nombre), img);
        };
        card.appendChild(img);
      } else {
        card.classList.add('a-card-no-image');
      }

      var name = document.createElement('div');
      name.className = 'a-card-name';
      name.textContent = item.nombre || 'Servicio';

      if (item.precio || item.duracion) {

        card.appendChild(badge);

      if (item.descripcion) {
        var desc = document.createElement('div');
        desc.className = 'a-card-desc';
        desc.textContent = item.descripcion;
        card.appendChild(desc);

      var cta = document.createElement('div');
      cta.className = 'a-card-cta';
      cta.style.color = cfg.color;
      cta.textContent = CORE.bookServiceLabel(cfg.language);
      card.appendChild(cta);

      // Todo el bloque es el botón: tocar en cualquier punto continúa la
      // conversación sin que el cliente escriba nada.
      card.addEventListener('click', function () {
        if (inp.disabled) return;
        if (wrap.parentNode) wrap.remove();

    wrap.appendChild(row);
    msgsEl.appendChild(wrap);
    // "estaAlFondo" mide contra el scrollHeight actual: justo tras crecer con

    // anterior deja de estarlo respecto al nuevo alto, así que el scroll
    // "inteligente" (pensado para no interrumpir a quien lee arriba) se
    // negaba a bajar — el bloque quedaba renderizado pero fuera de vista.
    // Esto es una reacción directa al propio mensaje del cliente, igual que
    // el "role === 'user'" de addMsg: siempre debe forzar. [BUG-SCROLL-GALERIA]
    CORE.irAlFondo(msgsEl, true);
  }

  // "Fotos de servicios" ya NO filtra por imagen: mostraba solo una parte del

  function renderGallery() {

  function buildIco(nombre) {
    var el = document.createElement('div');
    el.className = 'a-card-ico';
    el.textContent = CORE.iconFor(nombre);
    el.style.background = CORE.hexToRgba(cfg.color, 0.12);
    return el;
  }

  // "Paso 3/8" delante de cada pregunta: el visitante ve cuánto falta en vez
  // de responder a ciegas. Son 8 y no 5 porque teléfono, email y nota también
  // se piden: sin teléfono la API rechaza la reserva y el dueño se queda sin
  // forma de contactar.
// Extrae datos de reserva de un mensaje libre. Solo captura lo inequívoco:
// ante la duda no rellena, para que el flujo pregunte. Un campo inventado se
// convierte en una cita a la hora equivocada.
var FECHA_RE = new RegExp(
  '(pasado\\s+ma(ñ|n)ana|ma(ñ|n)ana|hoy|' +
  '(este|el|pr(ó|o)ximo)\\s+(lunes|martes|mi(é|e)rcoles|jueves|viernes|s(á|a)bado|domingo)|' +
  '(lunes|martes|mi(é|e)rcoles|jueves|viernes|s(á|a)bado|domingo)|' +
  '\\d{1,2}\\s+de\\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)|' +
  '\\d{1,2}[\\/\\-]\\d{1,2}(?:[\\/\\-]\\d{2,4})?|' +
  '\\d{4}-\\d{2}-\\d{2})', 'i');

// "3pm", "15:00", "3:30 pm", "a las 4". No inventamos AM/PM: si no lo dicen,
// se guarda la hora tal cual y el resumen la enseña antes de confirmar.
var HORA_RE = /(?:a\s+las\s+)?\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?\b/i;
var HORA_CTX = /(a\s+las|hrs?|horas?|:\d{2}|\ba\.?m\.?\b|\bp\.?m\.?\b)/i;

var PERSONAS_RE = /(?:para|somos|seríamos|serian|ser[ií]amos)\s+(\d{1,3}|un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\b|\b(\d{1,3}|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s+personas?\b/i;
var NUM_PAL = { un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10 };

var EMAIL_RE2 = /[^\s@]+@[^\s@]+\.[a-z]{2,}/i;
var TEL_RE = /(\+?\d[\d\s().-]{6,}\d)/;

// "las 4" puede ser las 04:00 o las 16:00. Se decide con el horario real del
// negocio: si solo una de las dos cae dentro, esa es. Si ambas o ninguna
// encajan, se pregunta en vez de adivinar.
function horasAbiertas(businessHours) {
  var set = {};
  if (!businessHours) return null;
  var vacio = true;
  Object.keys(businessHours).forEach(function (d) {
    var day = businessHours[d];
    if (!day || day.enabled === false || day.unknown) return;
    (day.ranges || []).forEach(function (r) {
      var a = parseInt(String(r.start || '').split(':')[0], 10);
      var b = parseInt(String(r.end || '').split(':')[0], 10);
      if (isNaN(a) || isNaN(b)) return;
      for (var h = a; h <= b; h++) { set[h] = true; vacio = false; }
    });
  });
  return vacio ? null : set;
}

// Devuelve { hora } resuelta, { ambigua: n } si hay que preguntar, o null.
function resolverHora(n, minutos, sufijo, businessHours) {
  var mm = minutos ? ':' + minutos : ':00';
  if (sufijo) {                                   // ya lo dijo la persona
    var s = sufijo.toUpperCase().replace(/\./g, '');
    return { hora: n + mm + ' ' + s };
  }
  if (n >= 13 && n <= 23) return { hora: n + mm };  // formato 24h, sin duda
  if (n === 0) return { hora: '12' + mm + ' AM' };
  if (n === 12) return { hora: '12' + mm + ' PM' };

  var abiertas = horasAbiertas(businessHours);
  if (!abiertas) return { ambigua: n, mm: mm };     // sin horario: preguntar
  var am = !!abiertas[n], pm = !!abiertas[n + 12];
  if (pm && !am) return { hora: n + mm + ' PM' };
  if (am && !pm) return { hora: n + mm + ' AM' };
  return { ambigua: n, mm: mm };                    // ambas o ninguna: preguntar
}

  // El modelo emite marcadores internos ([MOSTRAR_MENU], [RESERVA_CONFIRMADA],
  // [LEAD_MINIMO]…). Antes solo se quitaba [MOSTRAR_MENU] y el resto se
  // pintaba tal cual: al confirmar una reserva el visitante veía
  // "[RESERVA_CONFIRMADA]" en pantalla. Se limpian todos por patrón, así que
  // un marcador nuevo tampoco se escapará.

  // El prompt pide texto plano, pero el modelo se escapa y manda **negritas**
  // o ### títulos de vez en cuando. Aquí se limpian: en una burbuja de chat
  // los asteriscos se ven como un error, no como énfasis.
  // Solo bajamos solos si ya estabas abajo. Si subiste a releer algo, un
  // mensaje nuevo ya no te arrastra: era imposible leer el historial mientras
  // el bot escribía.
function extractBooking(text, menu) {
  var t = String(text || '');
  var out = {};

  // Servicio: solo nombres reales del catálogo. Nunca se inventa uno.
  if (Array.isArray(menu)) {
    var low = t.toLowerCase();
    var exacto = null, porPalabra = null;
    menu.forEach(function (m) {
      if (!m || !m.nombre) return;
      var n = String(m.nombre).toLowerCase();
      // El nombre completo en el texto gana siempre: "corte + barba" debe
      // ganar a "corte caballero", que solo coincide por la primera palabra.
      if (low.indexOf(n) !== -1) {
        if (!exacto || n.length > exacto.toLowerCase().length) exacto = m.nombre;
        return;
      }
      var head = n.split(/\s+/)[0].replace(/[^a-záéíóúñ]/gi, '');
      if (head.length >= 4 && new RegExp('\\b' + head, 'i').test(low)) {
        if (!porPalabra) porPalabra = m.nombre;
      }
    });
    var elegido = exacto || porPalabra;
    if (elegido) out.servicio = elegido;
  }

  var f = t.match(FECHA_RE);
  if (f) out.fecha = f[0].trim();

  if (HORA_CTX.test(t)) {
    var h = t.match(HORA_RE);
    if (h) {
      var hh = parseInt(h[1], 10);
      if (hh >= 0 && hh <= 23) {
        var r = resolverHora(hh, h[2], h[3], cfg.businessHours);
        if (r && r.hora) out.hora = r.hora;
        else if (r && r.ambigua) out.__horaAmbigua = { n: r.ambigua, mm: r.mm };
      }
    }
  }

  var p = t.match(PERSONAS_RE);
  if (p) {
    var raw = (p[1] || p[2] || '').toLowerCase();
    var n = /^\d+$/.test(raw) ? parseInt(raw, 10) : NUM_PAL[raw];
    if (n >= 1 && n <= 200) out.personas = String(n);
  }

  // El nombre solo se toma si la persona lo marca ("soy Ana", "me llamo…").
  // Sin marcador, en texto libre se confunde con cualquier palabra.
  var nm = t.match(/\b(?:soy|me\s+llamo|mi\s+nombre\s+es)\s+([A-Za-zÁÉÍÓÚÑáéíóúñ]{2,}(?:\s+[A-Za-zÁÉÍÓÚÑáéíóúñ]{2,})?)/i);
  if (nm) {
    var cand = nm[1].trim();
    if (!/^(que|quien|el|la|un|una|para|de|del)$/i.test(cand.split(/\s+/)[0])) out.nombre = cand;
  }

  var e = t.match(EMAIL_RE2);
  if (e) out.email = e[0];

  // Buscar el teléfono fuera del email: si no, los dígitos de "x1@y.com"
  // se colaban como número, o el email hacía perder el teléfono entero.
  var sinEmail = out.email ? t.replace(out.email, ' ') : t;
  var tel = sinEmail.match(TEL_RE);
  if (tel && tel[0].replace(/\D/g, '').length >= 7) out.telefono = tel[0].trim();

  return out;
}

  // Siguiente campo sin rellenar. El flujo deja de ser una cola fija: si el
  // cliente ya dijo servicio y fecha, esos pasos no se preguntan.
  // "Hola quiero corte mañana a las 4" no dice "reservar" ni "cita", así que
  // BOOKING_TRIGGERS no lo pillaba. Si hay intención + un servicio real + día
  // u hora, es una reserva. Se exige la palabra de intención a propósito:
  // "¿cuánto cuesta el corte mañana?" es una pregunta de precio, no una cita.

  // El paso pregunta un campo concreto, pero la persona puede responder otra
  // cosa ("Somos 3 personas" cuando se pedía el email). Sin esto, esa frase se
  // guardaba como email y el cliente nunca recibía su confirmación.
  // Primer campo sin rellenar, o -1 si ya está todo. `nota` no necesita trato
  // especial: ya es el último paso de la lista.
  // Cuando la hora podría ser AM o PM y el horario no lo aclara, se pregunta
  // en vez de decidir por el cliente. Una cita a las 4 AM no la quiere nadie.
   var horaPendiente = horaPendiente || null;

  function preguntarHoraAmbigua(amb, lang) {
    horaPendiente = amb;
    addMsg('bot', lang === 'en'
      ? 'Quick one 😊 do you mean ' + amb.n + ' in the afternoon or ' + amb.n + ' in the morning?'
      : 'Una cosita 😊 ¿te refieres a las ' + amb.n + ' de la tarde o a las ' + amb.n + ' de la mañana?');
  }

  function resolverHoraPendiente(t, lang) {
    if (!horaPendiente) return false;
    var esPM = /tarde|noche|pm|p\.m|afternoon|evening/i.test(t);
    var esAM = /ma(ñ|n)ana|madrugada|am|a\.m|morning/i.test(t);
    if (!esPM && !esAM) {
      addMsg('bot', lang === 'en' ? 'Sorry, morning or afternoon? 😊' : 'Perdona, ¿de la mañana o de la tarde? 😊');
      return true;
    }
    var hora = horaPendiente.n + horaPendiente.mm + (esPM ? ' PM' : ' AM');
    var amb = horaPendiente; horaPendiente = null;
    if (CORE.horaDentroDeHorario(hora, cfg.businessHours) === false) {
      rechazarHoraFueraDeHorario(lang);
      return true;
    }
    bookingData.hora = hora;
    addMsg('bot', (lang === 'en' ? 'Got it 😊 ' : 'Perfecto 😊 ') + '⏰ ' + bookingData.hora);
    seguirDesdeLoQueFalta(lang);
    return true;
  }

  // Ambigüedad de hora, pero para MODIFICAR una reserva activa (submitModify),
  // nunca para bookingData. Separado a propósito de horaPendiente/
  // resolverHoraPendiente: mezclarlos haría que responder "de la tarde"
  // durante un cambio de reserva pudiera escribir por error en una reserva
  // nueva sin terminar (o viceversa). [auditoría FASE 1 — reagendar]
  var modifyHoraPendiente = null;
  var modifyPendingUpdate = null;

  function preguntarModifyHoraAmbigua(amb, update, lang) {
    // modifyMode=true asegura que la respuesta ("de la tarde"/"de la
    // mañana") entre por el bloque que revisa modifyHoraPendiente primero
    // -- si esto se dispara desde el mensaje directo (MODIFY_TRIGGERS, sin
    // haber pasado por handleReservationAction), modifyMode todavía estaba
    // en false y la respuesta se perdía sin ser interpretada como AM/PM.
    modifyMode = true;
    modifyHoraPendiente = amb;
    modifyPendingUpdate = update || {};
    addMsg('bot', lang === 'en'
      ? 'Quick one 😊 do you mean ' + amb.n + ' in the afternoon or ' + amb.n + ' in the morning?'
      : 'Una cosita 😊 ¿te refieres a las ' + amb.n + ' de la tarde o a las ' + amb.n + ' de la mañana?');
  }

  function resolverModifyHoraPendiente(t, lang) {
    if (!modifyHoraPendiente) return false;
    var esPM = /tarde|noche|pm|p\.m|afternoon|evening/i.test(t);
    var esAM = /ma(ñ|n)ana|madrugada|am|a\.m|morning/i.test(t);
    if (!esPM && !esAM) {
      addMsg('bot', lang === 'en' ? 'Sorry, morning or afternoon? 😊' : 'Perdona, ¿de la mañana o de la tarde? 😊');
      return true;
    }
    var update = modifyPendingUpdate || {};
    update.hora = modifyHoraPendiente.n + modifyHoraPendiente.mm + (esPM ? ' PM' : ' AM');
    modifyHoraPendiente = null; modifyPendingUpdate = null;
    submitModify(update, lang);
    return true;
  }

  // Campos que una reserva necesita antes de pasar al resumen. La duración,
  // la capacidad y la disponibilidad las valida el servidor al crear.
   var BARE_OK = { nombre: 1, telefono: 1, email: 1, contacto: 1, specialRequests: 1 };
  function bookingFaltan() {
    return CORE.bookingRequirements(cfg, bookingData);
  }
  function bookingCaptured() {
    var out = {};
    CORE.summaryFields(cfg).concat(['contacto']).forEach(function (k) {
      if (bookingData[k]) out[k] = bookingData[k];
    });
    return out;
  }

  function rechazarHoraFueraDeHorario(lang) {
    delete bookingData.hora;
    bookingPending = 'hora';
    bookingReview = false;
    addMsg('bot', CORE.motivoDisponibilidadMensaje('fuera_de_horario', cfg, lang));
    save();
  }

  function recordFoodRequest(text, lang) {
    var food = CORE.applyFoodPreferences(bookingData.foodPreferences, text, cfg);
    if (food) {
      bookingData.foodPreferences = food;
      bookingData.specialRequests = CORE.foodPreferencesToSpecialRequests(food, lang);
    }
    if (CORE.isFoodMedical(text, cfg)) {
      addMsg('bot', lang === 'en'
        ? 'Thanks for telling us. I will note this dietary restriction for the restaurant. However, I cannot guarantee the absence of allergens or cross-contamination; the restaurant must confirm it directly.'
        : 'Gracias por avisarnos. Anotaré tu restricción alimentaria para que el restaurante la vea. Sin embargo, no puedo garantizar la ausencia de alérgenos o contaminación cruzada; el restaurante deberá confirmarlo directamente.');
    }
  }

  // Cada turno de la reserva lo redacta DeepSeek: se le manda el historial y el
  // estado estructurado (lo capturado y lo que falta) y responde natural,
  // pidiendo solo el próximo dato. El frontend sigue siendo dueño del estado y
  // la validación; el modelo nunca confirma ni inventa disponibilidad.
  function askBookingTurn(lang) {
    var faltan = bookingFaltan();
    var completo = faltan.length === 0;
    bookingPending = completo ? null : faltan[0];
    // The model never speaks for a complete booking; only the POST decides it.
    if (completo) { showBookingSummary(); return; }
    if (bookingPending === 'specialRequests') {
      addMsg('bot', CORE.specialRequestsQuestion(cfg.templateId, lang));
      return;
    }
    // Nombre de una sola palabra ya capturado: se pregunta de forma natural
    // en vez de dejar que el modelo vuelva a pedir "tu nombre" desde cero.
    // [Objetivo 5]
    if (bookingPending === 'nombre' && bookingData.nombre && CORE.esNombreUnaPalabra(bookingData.nombre)) {
      addMsg('bot', CORE.nombreConfirmacionMensaje(bookingData.nombre, lang));
      return;
    }
    busy = true; inp.disabled = true; snd.disabled = true;
    showTyping();
    var body = { clientId: clientId, messages: msgs, language: cfg.language, booking: { captured: bookingCaptured(), faltan: faltan } };
    if (previewToken) body.previewToken = previewToken;
    fetch(API + '/api/client-chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        hideTyping();
        var raw = (d && d.text) || '';
        // Notas: el modelo marca lo importante con [NOTA: ...] en esta misma
        // respuesta. Se acumula en bookingData.notes y se quita del texto (y del
        // historial) para que ni el cliente ni el modelo vuelvan a verlo.
        var nx = CORE.extractNotas(raw);
        if (nx.notas.length) bookingData.notes = CORE.fusionarNotas(bookingData.notes, nx.notas);
        var txt = raw ? CORE.limpiarMarcadores(nx.limpio) : '';
        if (!txt) txt = (lang === 'en' ? 'Could you share your ' : '¿Me compartes tu ') + faltan[0] + '?';
        addMsg('bot', txt);
        // Se persiste el texto ya saneado (lo mismo que se mostró): así ni el
        // cliente ni DeepSeek vuelven a ver marcadores al recargar el historial.
        msgs.push({ role: 'assistant', content: txt });
        save();
      })
      .catch(function () {
        hideTyping();
        addMsg('bot', lang === 'en' ? "Sorry, that didn't go through 😅 Mind trying again?" : 'Uy, no me llegó tu mensaje 😅 ¿Lo intentas otra vez?');
      })
      .finally(function () { busy = false; inp.disabled = false; snd.disabled = false; inp.focus(); });
  }

  // Antes emitía el "Paso N/8". Ahora es el punto por el que todo el flujo de
  // reserva pasa a DeepSeek.
  function seguirDesdeLoQueFalta(lang) { askBookingTurn(lang); }

  function pedirCorreccion(campo, lang) {
    if (resumenBotones && resumenBotones.parentNode) resumenBotones.remove();
    resumenBotones = null;
    delete bookingData[campo];
    bookingStep = 1;
    bookingPending = campo;
    bookingReview = false;
    var etiqueta = CORE.summaryLabel(cfg, campo, lang).toLowerCase();
    addMsg('bot', lang === 'en'
      ? 'Sure 😊 What is the correct ' + etiqueta + '?'
      : 'Claro 😊 ¿cuál es el dato correcto de ' + etiqueta + '?');
    save();
  }


  // Última parada antes de guardar: se enseña todo y se pide confirmación.
  // Antes la reserva se enviaba sola al responder el último campo, sin que
  // nadie pudiera revisar un dedazo en el teléfono o la fecha.
  function showBookingSummary() {
    var lang = cfg.language === 'en' ? 'en' : 'es';
    // Si el mensaje del cliente no fue ni una confirmación clara ni una
    // corrección reconocida (ej. "todo está correcto" antes de ampliar
    // CONFIRMACIONES), el flujo caía aquí de nuevo con el resumen ya visible
    // y su par de botones aún en pantalla: se agregaba un SEGUNDO resumen con
    // un SEGUNDO par de botones, sin quitar el primero. Se quita el anterior
    // antes de mostrar uno nuevo para que solo exista un botón real a la vez.
    // [BUG-RESUMEN-DUPLICADO]
    if (resumenBotones && resumenBotones.parentNode) resumenBotones.remove();

    var lineas = CORE.summaryFields(cfg).concat(['contacto'])
      .filter(function (k) { return bookingData[k]; })
      .map(function (k) { return RESUMEN_ICONOS[k] + ' ' + CORE.summaryLabel(cfg, k, lang) + ': ' + bookingData[k]; });

    var quien = bookingData.nombre ? ' ' + String(bookingData.nombre).split(/\s+/)[0] : '';
    addMsg('bot', (lang === 'en'
        ? 'Perfect' + quien + ' 😊 let\'s check everything before confirming:\n\n'
        : 'Perfecto' + quien + ' 😊 revisemos que todo esté correcto antes de confirmar:\n\n') +
      lineas.join('\n') + (lang === 'en' ? '\n\nAll good? 😄' : '\n\n¿Todo correcto? 😄'));

    var wrap = document.createElement('div');
    wrap.className = 'a-quick';
    resumenBotones = wrap;
    [{ label: lang === 'en' ? '✅ Yes, confirm it' : '✅ Sí, confirmar cita', ok: true },
     { label: lang === 'en' ? '✏️ I want to change something' : '✏️ Quiero cambiar algo', ok: false }
    ].forEach(function (a, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'a-quick-btn';
      b.textContent = a.label;
      b.style.animationDelay = (i * 60) + 'ms';
      b.addEventListener('click', function () {
        wrap.remove();
        if (resumenBotones === wrap) resumenBotones = null;
        if (a.ok) {
          addMsg('user', a.label);
          submitBooking();
        } else {
          bookingStep = 1;
          bookingPending = null;
          bookingReview = false;
          addMsg('user', a.label);
          addMsg('bot', lang === 'en' ? 'What would you like to change? Your other reservation details will stay the same.' : '¿Qué quieres cambiar? Tus demás datos de reserva se conservarán.');
        }
      });
      wrap.appendChild(b);
    });
    msgsEl.appendChild(wrap);
    // Mismo bug que la galería: el resumen (potencialmente varias líneas) ya
    // hizo crecer el contenedor antes de que estos botones se agreguen, así
    // que el scroll "inteligente" podía negarse a bajar y dejar el botón
    // real de confirmación fuera de vista. Reacción directa al mensaje del
    // cliente: siempre debe forzar. [BUG-SCROLL-GALERIA]
    CORE.irAlFondo(msgsEl, true);
    bookingReview = true;   // solo el botón "✅ Sí, confirmar cita" crea la reserva
    save();
  }

  function submitBooking() {
    if (submitting) return;        // evita envíos duplicados (doble clic / doble Enter)
    submitting = true;
    bookingReview = false;
    var lang = cfg.language === 'en' ? 'en' : 'es';
    // Clave de idempotencia estable para ESTE intento de reserva. Se conserva en
    // bookingData, así un reintento tras respuesta perdida manda la misma clave y
    // el backend devuelve la reserva ya creada en vez de duplicarla. [BUG-4]
    if (!bookingData.idempotencyKey) bookingData.idempotencyKey = CORE.genIdempotencyKey();
    busy = true; inp.disabled = true; snd.disabled = true;
    addMsg('bot', lang === 'en' ? 'Checking availability…' : 'Revisando disponibilidad…');
    fetch(API + '/api/reservations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ clientId: clientId }, bookingData, { language: lang })),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        // El servidor rechazó la cita (cerrado, poca anticipación, sin hueco…).
        // Redacción centralizada por idioma y plantilla — el backend sigue
        // siendo la única autoridad sobre motivo/alternativa, esto solo
        // decide cómo se dice. [auditoría — tono frío / mensajes centralizados]
        if (d && d.ok === false && d.motivo) {
          var msg = CORE.motivoDisponibilidadMensaje(d.motivo, cfg, lang, d.alternativa);
          addMsg('bot', msg);
          msgs = msgs.filter(function (m) { return m.role !== 'assistant' || !/pendiente|confirmad[ao]|equipo.*revis/i.test(m.content); });
          save();
          delete bookingData.hora;   // se conserva todo menos la hora
          bookingStep = 1;
          return;
        }
        if (d && d.ok) {   // éxito: creada nueva o reconocida idempotente (duplicate)
          // El estado real lo dice el backend, no DeepSeek. Se guarda la reserva
          // activa para reconocerla al recargar, impedir duplicados y permitir
          // modificar/cancelar por su actionToken. [BUG-4/5]
          activeReservation = {
            reservationId: d.reservationId || (activeReservation && activeReservation.reservationId) || null,
            actionToken: d.actionToken || (activeReservation && activeReservation.actionToken) || null,
            fecha: bookingData.fecha, hora: bookingData.hora,
            personas: bookingData.partySize || bookingData.personas || '',
            servicio: bookingData.servicio || '',
            specialRequests: bookingData.specialRequests || '',
            estado: d.status || 'confirmada', confirmedAt: Date.now(), language: lang,
          };
          saveReserva();
          addMsg('bot', d.duplicate ? CORE.reservaTextos(lang).duplicateActive : CORE.mensajeReservaGuardada(cfg, d, lang));
          if (d.duplicate) offerReservationActions(lang);
          // Reserva terminada con éxito: se olvida el servicio recordado.
          // [Objetivo 4]
          bookingStep = 0; bookingData = {}; bookingPending = null; dupAttempts = 0; selectedService = '';
          save();
          return;
        }
        // No se pudo guardar: se conservan los datos y se ofrece reintentar.
        addMsg('bot', lang === 'en'
          ? "We couldn't save your request 😕 Your details are still here — want to try again?"
          : 'No pudimos guardar tu solicitud 😕 Tus datos siguen aquí, ¿lo intentamos de nuevo?');
        showBookingSummary();
      })
      .catch(function () {
        addMsg('bot', lang === 'en'
          ? "Sorry, that didn't go through 😅 Your details are still here — try again?"
          : 'Uy, no se envió 😅 Tus datos siguen aquí, ¿lo intentamos otra vez?');
        showBookingSummary();
      })
      .finally(function () {
        submitting = false;
        busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
      });
  }


  // ── Reserva activa: acciones (modificar / cancelar) ─────────────────────
  // Toda la lógica y los textos son deterministas y compartidos con widget.js
  // vía chat-core (CORE.reservaTextos / reservaResumen / duplicateAttemptState /
  // buildModifyUpdate), para que ambas superficies no diverjan ni mezclen idioma.
  function offerReservationActions(lang) {
    var T = CORE.reservaTextos(lang);
    // Mismo bug que el resumen de reserva: si esto se llama de nuevo (más
    // intentos de doble reserva) con el par anterior aún en pantalla, se
    // apilaba un segundo Modificar/Cancelar/Mantener. [BUG-RESUMEN-DUPLICADO]
    if (accionesBotones && accionesBotones.parentNode) accionesBotones.remove();
    var wrap = document.createElement('div');
    wrap.className = 'a-quick';
    accionesBotones = wrap;
    [{ label: T.modify, act: 'modify' }, { label: T.cancel, act: 'cancel' }, { label: T.keep, act: 'keep' }
    ].forEach(function (o, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'a-quick-btn'; b.textContent = o.label; b.style.animationDelay = (i * 60) + 'ms';
      b.addEventListener('click', function () {
        wrap.remove();
        if (accionesBotones === wrap) accionesBotones = null;
        addMsg('user', o.label);
        handleReservationAction(o.act, lang);
      });
      wrap.appendChild(b);
    });
    msgsEl.appendChild(wrap);
    // Reacción directa al mensaje del cliente: forzar, igual que la galería y
    // el resumen de reserva. [BUG-SCROLL-GALERIA]
    CORE.irAlFondo(msgsEl, true);
  }

  function handleReservationAction(act, lang) {
    dupPending = false;
    if (!activeReservation) return;
    var T = CORE.reservaTextos(lang);
    if (act === 'keep') { addMsg('bot', T.keepMsg); return; }
    if (act === 'cancel') { submitActiveCancel(lang); return; }
    modifyMode = true;
    addMsg('bot', T.askChange);
  }

  function submitActiveCancel(lang) {
    var T = CORE.reservaTextos(lang);
    if (!activeReservation || !activeReservation.actionToken) { addMsg('bot', T.notFound); return; }
    busy = true; inp.disabled = true; snd.disabled = true; showTyping();
    fetch(API + '/api/cancel-reservation', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: clientId, actionToken: activeReservation.actionToken }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      hideTyping();
      if (d.found || d.ok) {
        addMsg('bot', T.cancelled);
        activeReservation = null; dupAttempts = 0; spamUntil = 0; modifyMode = false; saveReserva();
      } else addMsg('bot', T.cancelFail);
    }).catch(function () { hideTyping(); addMsg('bot', T.netFail); })
    .finally(function () { busy = false; inp.disabled = false; snd.disabled = false; inp.focus(); });
  }

  function submitModify(update, lang) {
    var T = CORE.reservaTextos(lang);
    if (!activeReservation || !activeReservation.actionToken) { addMsg('bot', T.notFound); modifyMode = false; return; }
    // fecha/hora son obligatorias en reschedule; si el cambio no las trae, se
    // reenvían las actuales para conservar la reserva.
    var body = {
      clientId: clientId, action: 'reschedule', actionToken: activeReservation.actionToken,
      fecha: update.fecha || activeReservation.fecha, hora: update.hora || activeReservation.hora,
    };
    if (update.partySize || update.personas) body.partySize = update.partySize || update.personas;
    if (update.specialRequests) body.specialRequests = update.specialRequests;
    if (update.foodPreferences) body.foodPreferences = update.foodPreferences;
    if (update.servicio) body.servicio = update.servicio;
    busy = true; inp.disabled = true; snd.disabled = true; showTyping();
    fetch(API + '/api/reservations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(function (d) {
        hideTyping();
        if (d.ok && d.reservation) {
          activeReservation.fecha = d.reservation.fecha; activeReservation.hora = d.reservation.hora;
          activeReservation.personas = d.reservation.partySize || d.reservation.personas || activeReservation.personas;
          activeReservation.servicio = d.reservation.servicio || activeReservation.servicio;
          activeReservation.specialRequests = d.reservation.specialRequests || activeReservation.specialRequests;
          activeReservation.estado = d.reservation.estado || activeReservation.estado;
          activeReservation.actionToken = d.reservation.actionToken || activeReservation.actionToken;
          saveReserva();
          addMsg('bot', T.modifyDone + CORE.reservaResumen(activeReservation, lang));
        } else if (d.ok === false && d.motivo) {
          // Redacción centralizada por idioma y plantilla, igual que en la
          // reserva nueva. [auditoría — tono frío / mensajes centralizados]
          addMsg('bot', CORE.motivoDisponibilidadMensaje(d.motivo, cfg, lang, d.alternativa));
        } else addMsg('bot', T.modifyFail);
      }).catch(function () { hideTyping(); addMsg('bot', T.netFail); })
      .finally(function () { modifyMode = false; busy = false; inp.disabled = false; snd.disabled = false; inp.focus(); });
  }

  // Intento de crear otra reserva teniendo una activa: nunca se crea otra.
  // Escalado + límite temporal deterministas y compartidos. [BUG-4]
  function handleDuplicateAttempt(lang) {
    var s = CORE.duplicateAttemptState(activeReservation, dupAttempts, spamUntil, Date.now(), lang);
    dupAttempts = s.attempts; spamUntil = s.spamUntil;
    dupPending = true;
    addMsg('bot', s.text);
    offerReservationActions(lang);
  }

  function submitEmailAction(data) {
    var lang = cfg.language === 'en' ? 'en' : 'es';
    busy = true; inp.disabled = true; snd.disabled = true;
    var url = emailAction.action === 'cancel' ? '/api/cancel-reservation' : '/api/reservations';
    var body = emailAction.action === 'cancel'
      ? { clientId: clientId, actionToken: emailAction.token }
      : { clientId: clientId, action: 'reschedule', actionToken: emailAction.token, fecha: data.fecha, hora: data.hora };
    fetch(API + url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.found || d.ok) {
          addMsg('bot', emailAction.action === 'cancel'
            ? (lang === 'en' ? '✅ Your reservation has been cancelled.' : '✅ Tu reserva fue cancelada correctamente.')
            : (lang === 'en' ? '✅ Your reservation has been rescheduled.' : '✅ Tu reserva fue reprogramada correctamente.'));
          emailAction = null;
        } else addMsg('bot', d.motivo
          // Redacción centralizada por idioma y plantilla — antes se filtraba
          // d.mensaje crudo (siempre en español) en este mismo punto, el que
          // usa exactamente el reagendado desde el enlace del correo.
          // [auditoría — tono frío / mensajes centralizados]
          ? CORE.motivoDisponibilidadMensaje(d.motivo, cfg, lang, d.alternativa)
          : (lang === 'en' ? 'That time is not available. Please choose another time.' : 'Ese horario no está disponible. Elige otro horario.'));
      })
      .catch(function () { addMsg('bot', lang === 'en' ? 'Sorry, please try again.' : 'No pudimos completar la acción. Inténtalo de nuevo.'); })
      .finally(function () { busy = false; inp.disabled = false; snd.disabled = false; inp.focus(); });
  }

  function send(text) {
    if (busy || !text.trim()) return;
    var t = text.trim();
    // El idioma ya quedó fijado por el selector inicial (o client.language
    // como fallback): nunca se vuelve a detectar aquí. [Objetivo 1, regla 7]
    var lang = cfg.language === 'en' ? 'en' : 'es';

    if (emailAction) {
      addMsg('user', t);
      if (emailAction.action === 'cancel') {
        if (CORE.esConfirmacion(t, lang)) submitEmailAction({});
        else addMsg('bot', lang === 'en' ? 'No changes were made.' : 'No se realizó ningún cambio.');
        return;
      }
      var requested = CORE.extractBooking(t, cfg.menu, cfg.businessHours, cfg.language, cfg);
      if (!requested.fecha || !requested.hora) {
        addMsg('bot', lang === 'en' ? 'Please provide the new date and time.' : 'Indica la nueva fecha y hora.');
        return;
      }
      submitEmailAction(requested);
      return;
    }

    // Modo modificar: el siguiente mensaje trae el cambio para la reserva activa.
    if (modifyMode) {
      addMsg('user', t);
      // Se responde primero por si el mensaje es la respuesta AM/PM a una
      // ambigüedad pendiente de un cambio anterior (no una nueva instrucción).
      if (resolverModifyHoraPendiente(t, lang)) return;
      if (/^(cancelar|cancel|salir|exit)$/i.test(t)) { modifyMode = false; modifyHoraPendiente = null; modifyPendingUpdate = null; addMsg('bot', CORE.reservaTextos(lang).noChange); return; }
      var update = CORE.buildModifyUpdate(t, cfg, activeReservation);
      if (update.__horaAmbigua) {
        var ambU = update.__horaAmbigua; delete update.__horaAmbigua;
        preguntarModifyHoraAmbigua(ambU, update, lang);
        return;
      }
      if (!Object.keys(update).length) { addMsg('bot', CORE.reservaTextos(lang).needChange); return; }
      submitModify(update, lang);
      return;
    }

    // Con una reserva ya activa, un nuevo intento de reservar no crea otra:
    // se ofrece modificar o cancelar. Cancelar/modificar por intención van
    // directos a la reserva activa por su token. [BUG-4/5]
    if (activeReservation && bookingStep === 0 && featureOn('reservations')) {
      var preAR = CORE.extractBooking(t, cfg.menu, cfg.businessHours, cfg.language, cfg);
      var looksNew = CORE.pareceReserva(t, preAR) || BOOKING_TRIGGERS.test(t);
      if (isCancellationRequest(t)) {
        dupPending = false;
        if (accionesBotones && accionesBotones.parentNode) accionesBotones.remove();
        accionesBotones = null;
        addMsg('user', t); submitActiveCancel(lang); return;
      }
      if (MODIFY_TRIGGERS.test(t)) {
        addMsg('user', t);
        // El mismo mensaje que dispara "modificar" ya puede traer la fecha/
        // hora nueva (ej. "cámbiala mañana a las 8:30 PM"): no se descarta
        // ni se vuelve a preguntar lo que ya se dijo. [auditoría FASE 1]
        var directUpdate = CORE.buildModifyUpdate(t, cfg, activeReservation);
        if (directUpdate.__horaAmbigua) {
          var ambDirect = directUpdate.__horaAmbigua; delete directUpdate.__horaAmbigua;
          preguntarModifyHoraAmbigua(ambDirect, directUpdate, lang);
          return;
        }
        if (Object.keys(directUpdate).length) { submitModify(directUpdate, lang); return; }
        handleReservationAction('modify', lang);
        return;
      }
      if (looksNew) { addMsg('user', t); handleDuplicateAttempt(lang); return; }
    }

    // Se ofrecieron los botones Modificar/Cancelar/Mantener y el cliente
    // escribió otra cosa en vez de tocar uno: antes esto caía directo al chat
    // libre, y el modelo -sin saber que hay una reserva activa esperando una
    // decisión- improvisaba su propio "resumen" y pedía un "sí" que nunca
    // crea nada real (el flujo real ya terminó, solo faltan los botones de
    // arriba). Se recuerda usar los botones en vez de dejarlo hablar solo.
    // [BUG-DUPLICADO-CHAT-LIBRE]
    if (dupPending) {
      addMsg('user', t);
      addMsg('bot', lang === 'en'
        ? 'You already have an active reservation — please choose one of the options above (✏️ Modify / ❌ Cancel / ✅ Keep) 😊'
        : 'Ya tienes una reserva activa — elige una de las opciones de arriba (✏️ Modificar / ❌ Cancelar / ✅ Mantener) 😊');
      return;
    }

    if (bookingStep > 0) {
      if (/^(cancelar|cancel|salir|exit)$/i.test(t)) {
        bookingStep = 0; bookingData = {}; bookingReview = false;
        selectedService = '';   // cancelar el flujo olvida el servicio recordado [Objetivo 4]
        if (resumenBotones && resumenBotones.parentNode) resumenBotones.remove();
        resumenBotones = null;
        addMsg('user', t);
        addMsg('bot', lang === 'en' ? 'Reservation cancelled. Is there anything else I can help with?' : 'Reserva cancelada. ¿Hay algo más en lo que pueda ayudarte?');
        return;
      }
      // La reserva SOLO se crea con el botón "✅ Sí, confirmar cita": un "sí"
      // escrito nunca debe confirmarla por su cuenta (puede ser una respuesta
      // apresurada sin haber revisado bien el resumen). Se pide que use el
      // botón en vez de dar la reserva por hecha. [BUG-CONFIRMACION-TEXTO]
      if (bookingReview || (function () { try { return JSON.parse(sessionStorage.getItem(BOOKING_SESS) || '{}').awaitingConfirmation === true; } catch (e) { return false; } })()) {
        addMsg('user', t);
        if (CORE.esConfirmacion(t, lang)) submitBooking();
        else if (CORE.campoCorreccion(t)) pedirCorreccion(CORE.campoCorreccion(t), lang);
        else showBookingSummary();
        return;
      }
      // Cualquier otra cosa en el resumen es un cambio: se sale de revisión y
      // se procesa como corrección/dato nuevo.
      bookingReview = false;
      addMsg('user', t);
      msgs.push({ role: 'user', content: t });

      // Nombre de una sola palabra en espera de confirmación: decidido por
      // CORE.confirmarNombreUnaPalabra() (compartida con widget.js) para que
      // nunca se anexe como apellido un correo/teléfono/fecha/hora/servicio/
      // negación ya reconocido en este mismo mensaje. [auditoría — nombre
      // corrupto]
      if (bookingPending === 'nombre' && bookingData.nombre && !bookingData.__nombreConfirmado) {
        var extraCampos = CORE.extractBooking(t, cfg.menu, cfg.businessHours, cfg.language, cfg);
        bookingData = CORE.confirmarNombreUnaPalabra(bookingData, t, extraCampos, lang);
        save();
        askBookingTurn(lang);
        return;
      }

      if (resolverHoraPendiente(t, lang)) return;

      // Extracción determinista: mete en el estado lo que el mensaje traiga,
      // esté o no en el orden esperado.
      var yaVisto = CORE.extractBooking(t, cfg.menu, cfg.businessHours, cfg.language, cfg);
        var amb = yaVisto.__horaAmbigua; if (amb) delete yaVisto.__horaAmbigua;
        var fueraDeHorario = yaVisto.__horaFueraDeHorario; if (fueraDeHorario) delete yaVisto.__horaFueraDeHorario;
       var traidos = Object.keys(yaVisto);
       traidos.forEach(function (k) { bookingData[k] = yaVisto[k]; });
       // Cambio explícito de servicio dentro del flujo: se recuerda para la
       // próxima reserva también. [Objetivo 4]
       if (yaVisto.servicio) selectedService = yaVisto.servicio;
       var campoCorreccion = CORE.campoCorreccion(t);

      // Preferencias que el cliente dice en su propio mensaje ("prefiero una
      // habitación silenciosa"), sin depender de que DeepSeek emita [NOTA:].
       var notasU = CORE.extractNotasUsuario(t, cfg);
       if (notasU.length) bookingData.notes = CORE.fusionarNotas(bookingData.notes, notasU);
       recordFoodRequest(t, lang);

      // "Quiero cambiar la hora" sin dar valor nuevo: se borra el campo para
      // que DeepSeek vuelva a pedirlo con naturalidad.
      // Antes se exigía "nada se extrajo en este mensaje" (!traidos.length)
      // para aceptar el texto libre como respuesta al dato pendiente. Si el
      // cliente repetía un dato YA capturado en la misma frase donde
      // contestaba lo que se le pedía ("mi correo es X, como ya te dije, y no
      // tengo ninguna petición especial"), esa repetición SÍ se detectaba
      // (traidos.length > 0 por el correo), así que la respuesta real
      // quedaba descartada y el asistente repetía la misma pregunta sin fin
       // — el cliente sentía que "no lo escuchaba". Ahora solo importa si el
       // dato pendiente EN SÍ sigue sin capturarse. [BUG-MEMORIA-REPETIDA]
       var pendienteSinCapturar = bookingPending && traidos.indexOf(bookingPending) === -1;
       if (campoCorreccion && traidos.indexOf(campoCorreccion) === -1) {
         pedirCorreccion(campoCorreccion, lang);
         return;
       } else if (pendienteSinCapturar && CORRECCION_RE.test(t)) {
         // Sin campo mencionado, "prefiero"/"mejor" es la respuesta al campo pendiente, no una corrección vacía. [BUG-CORRECCION-PENDIENTE]
         if (BARE_OK[bookingPending] && !bookingData[bookingPending] && CORE.valorValido(bookingPending, t)) {
           bookingData[bookingPending] = bookingPending === 'specialRequests' && CORE.esSinPeticionEspecial(t) ? '' : t;
         }
      }
      // Respuesta escueta al dato que se estaba pidiendo (ej. "Mike" tras
      // "¿tu nombre?"). Solo para campos donde el texto crudo es seguro; la
      // hora/fecha/servicio necesitan la extracción para normalizarse.
       else if (pendienteSinCapturar && BARE_OK[bookingPending] &&
                !bookingData[bookingPending] && CORE.valorValido(bookingPending, t)) {
         bookingData[bookingPending] = bookingPending === 'specialRequests' && CORE.esSinPeticionEspecial(t) ? '' : t;
      }

        if (fueraDeHorario) { rechazarHoraFueraDeHorario(lang); return; }
        if (amb) { preguntarHoraAmbigua(amb, lang); return; }
       save();
       askBookingTurn(lang);
      return;
    }

    if (featureOn('cancellation') && isCancellationRequest(t)) {
      addMsg('user', t);
      addMsg('bot', lang === 'en'
        ? 'To cancel securely, open the reservation link from your confirmation email.'
        : 'Para cancelar de forma segura, abre el enlace de reserva de tu correo de confirmación.');
      return;
    }

    var preExtraido = featureOn('reservations') ? CORE.extractBooking(t, cfg.menu, cfg.businessHours, cfg.language, cfg) : {};
    // Se recuerda el servicio aunque este mensaje NO dispare el modo reserva
    // (chat libre, tarjeta, catálogo): así "quiero reservar" más adelante no
    // vuelve a preguntar un servicio ya mencionado. [Objetivo 4]
    if (preExtraido.servicio) selectedService = preExtraido.servicio;
    if (featureOn('reservations') && CORE.pareceReserva(t, preExtraido)) {
      addMsg('user', t);
      msgs.push({ role: 'user', content: t });
      save();
      bookingStep = 1;          // en modo reserva; el índice ya no importa
      bookingData = {};

      // Lo que el cliente ya dijo en el primer mensaje entra al estado y no se
      // vuelve a preguntar. El resto lo conduce DeepSeek.
       var ambigua = preExtraido.__horaAmbigua;
       var fueraDeHorarioInicial = preExtraido.__horaFueraDeHorario;
       delete preExtraido.__horaAmbigua;
       delete preExtraido.__horaFueraDeHorario;
      Object.keys(preExtraido).forEach(function (k) { bookingData[k] = preExtraido[k]; });
      // bookingData.servicio || selectedService: si este mensaje no vuelve a
      // nombrar el servicio, se usa el que ya se había elegido antes. [Objetivo 4]
      bookingData.servicio = CORE.resolveServicio(bookingData, selectedService);

       var notasIni = CORE.extractNotasUsuario(t, cfg);
       if (notasIni.length) bookingData.notes = CORE.fusionarNotas(bookingData.notes, notasIni);
       recordFoodRequest(t, lang);

        if (fueraDeHorarioInicial) { rechazarHoraFueraDeHorario(lang); return; }
        if (ambigua) { preguntarHoraAmbigua(ambigua, lang); return; }
       save();
       askBookingTurn(lang);
      return;
    }

    busy = true; inp.disabled = true; snd.disabled = true;
    addMsg('user', text);
    msgs.push({ role: 'user', content: text });
    save();
    showTyping();

    fetch(API + '/api/client-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(previewToken
        ? { clientId: clientId, messages: msgs, language: cfg.language, previewToken: previewToken }
        : { clientId: clientId, messages: msgs, language: cfg.language }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        hideTyping();
        if (d.error === 'inactive') {
          addMsg('bot', d.message || (cfg.language === 'en' ? 'This assistant is temporarily out of service. Please contact the business directly.' : 'Este asistente se encuentra temporalmente fuera de servicio. Comunícate directamente con el negocio.'));
        } else if (d.text) {
          if (d.preview === true) marcarModoPrueba();
          var showMenu    = /\[MOSTRAR_MENU\]/.test(d.text);
          var showGallery = /\[MOSTRAR_GALERIA\]/.test(d.text);
          var showServicePhotos = /\[MOSTRAR_SERVICIOS_CON_FOTOS\]/.test(d.text);
          var cleanText = CORE.limpiarMarcadores(d.text);
          var shownTexts = [];
          if (showMenu && !showServicePhotos) {
            // Determinista: nunca se confía en que el modelo haya sido
            // breve. Se muestra SIEMPRE esta frase, construida por código,
            // antes de las tarjetas — y se descarta la parte del texto del
            // modelo que solo repite el catálogo (2+ servicios nombrados);
            // si trae algo más útil, se conserva. [Objetivo 2]
            var intro = CORE.catalogIntro(cfg, lang);
            addMsg('bot', intro);
            shownTexts.push(intro);
            // Si el modelo devolvió la misma intro (aunque con distinta
            // puntuación/mayúsculas) no se repite una segunda vez.
            // [auditoría — intro duplicada]
            if (cleanText && !CORE.isCatalogIntroEcho(cleanText, cfg, lang) && !CORE.looksLikeCatalogRestatement(cleanText, cfg.menu)) {
              addMsg('bot', cleanText);
              shownTexts.push(cleanText);
            }
          } else if (cleanText) {
            addMsg('bot', cleanText);
            shownTexts.push(cleanText);
          }
          // Pedir fotos ya no fuerza el catálogo completo: cada marcador
          // controla solo su propio bloque. [BUG-FOTOS-GALERIA]
          if (showServicePhotos) renderServicesWithPhotos();
          else { if (showMenu) renderMenu(); if (showGallery) renderGallery(); }
          // La acción interna (mostrar menú/galería) ya se extrajo de d.text; al
          // historial va solo lo que realmente se mostró, nunca el marcador crudo.
          msgs.push({ role: 'assistant', content: shownTexts.join('\n\n') });
          save();
        } else {
          addMsg('bot', cfg.language === 'en' ? "Sorry, I didn't catch that 😅 Could you say it again?" : 'Perdona, no te entendí bien 😅 ¿Me lo repites?');
        }
      })
      .catch(function () {
        hideTyping();
        addMsg('bot', cfg.language === 'en' ? "Sorry, that didn't go through 😅 Mind trying again?" : 'Uy, no me llegó tu mensaje 😅 ¿Lo intentas otra vez?');
      })
      .finally(function () {
        busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
      });
  }

  snd.addEventListener('click', function () {
    var t = inp.value.trim();
    inp.value = '';
    send(t);
  });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var t = inp.value.trim();
      inp.value = '';
      send(t);
    }
  });

  // ── Load client config, then show the chat ──────────────────────────────
  fetch(API + '/api/client-config?id=' + encodeURIComponent(clientId))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) {
        loadingEl.style.display = 'none';
        notfoundEl.style.display = 'flex';
        return;
      }
      Object.assign(cfg, d);
      // Si ya eligió idioma (botón del selector, en esta sesión), se respeta
      // sin volver a detectar nada del texto del cliente. [Objetivo 1, regla 7]
      if (hasLanguageChoice()) {
        var saved = storedLanguage();
        if (saved) cfg.language = saved;
      }
      loadingEl.style.display = 'none';
      appEl.style.display = 'flex';
      paint();
      snd.disabled = false;

      // Historial viejo puede tener marcadores crudos guardados antes de este
      // fix: se sanea también al restaurar, por compatibilidad.
      msgs.forEach(function (m) {
        var esBot = m.role !== 'user';
        addMsg(esBot ? 'bot' : 'user', esBot ? CORE.limpiarMarcadores(m.content) : m.content);
      });
      if (!msgs.length) {
        // El selector de idioma no interrumpe un enlace de email (cancelar/
        // reprogramar): esa acción sigue con el idioma guardado o el de
        // client.language, tal como antes. [Objetivo 1]. Con emailAction
        // tampoco se muestra el saludo genérico de negocio — se reemplaza
        // por el contexto real de la reserva, reconstruido más abajo.
        // [auditoría — reagendado sin saludo genérico]
        if (!emailAction && hasLanguageChoice() && !storedLanguage()) showLanguageChoice();
        else if (!emailAction) showGreetingNow();
      }
      // Links from email must work even if this browser has an unrelated
      // previous chat session saved for the same business. El contexto (y el
      // idioma real de la reserva) se recupera con un lookup de solo lectura
      // por actionToken — nunca de un ?lang= manipulable ni de un saludo
      // genérico. [auditoría — idioma del reagendado / reagendado sin saludo]
      if (emailAction) {
        fetch(API + '/api/reservations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId: clientId, action: 'lookup', actionToken: emailAction.token }),
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var reservation = d && d.found ? d.reservation : null;
            if (reservation && reservation.language) { cfg.language = reservation.language; paint(); }
            var lang = cfg.language === 'en' ? 'en' : 'es';
            addMsg('bot', reservation
              ? CORE.emailActionContextoMensaje(emailAction.action, cfg, lang, reservation)
              : CORE.reservaTextos(lang).notFound);
          })
          .catch(function () {
            // Fallback seguro: si el lookup falla, no deja el enlace bloqueado.
            var lang = cfg.language === 'en' ? 'en' : 'es';
            addMsg('bot', emailAction.action === 'cancel'
              ? (lang === 'en' ? 'Do you confirm that you want to cancel this reservation?' : '¿Confirmas que quieres cancelar esta reserva?')
              : (lang === 'en' ? 'Tell me the new date and time you prefer.' : 'Indica la nueva fecha y hora que prefieres.'));
          });
      }
      setTimeout(function () { inp.focus(); }, 200);
    })
    .catch(function () {
      loadingEl.style.display = 'none';
      notfoundEl.style.display = 'flex';
    });

})();
</script>
</body>
</html>
