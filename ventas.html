<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Asistente de Ventas — JB Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <script>

    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1062633503132094&ev=PageView&noscript=1"
         alt="" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #0f2b1e;
      --green-main:   #1f5a3b;
      --green-soft:   #4a8b66;
      --cream:        #f5f0e4;
      --cream-soft:   #fbf8f1;
      --cream-deep:   #e9dfcf;
      --border-card:  rgba(25,61,43,0.14);
      --border-inner: rgba(25,61,43,0.10);
      --text:         #173323;
      --text-muted:   #5c6f63;
      --radius-card:  28px;
      --radius:       20px;
      --radius-sm:    12px;
    }

    /* ── Page background ── */
    html {
      height: 100%;
      height: 100dvh;
    }

    body {
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      color: var(--text);
      background: var(--green-dark);
      background-image:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(255,255,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 55% 40% at 100% 100%, rgba(74,139,102,0.18) 0%, transparent 55%);
      overflow: hidden;
    }

    /* ── Chat Stage ── */
    #app {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      height: min(860px, calc(100dvh - 48px));
      align-items: center;
    }

    #chat-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: min(860px, calc(100dvh - 48px));
      border-radius: 36px;
      overflow: hidden;
      background: var(--cream);
      border: 1px solid rgba(31,90,59,0.26);
      box-shadow:
        0 0 0 4px rgba(6,45,32,0.95),
        0 0 0 6px rgba(95,146,112,0.24),
        0 26px 70px rgba(4,14,10,0.42),
        0 36px 110px rgba(4,14,10,0.24),
        inset 0 1px 0 rgba(255,255,255,0.65),
        inset 0 -18px 24px rgba(10,29,20,0.08);
      position: relative;
      transition: box-shadow 220ms ease, border-color 220ms ease, transform 220ms ease;
    }

    #chat-shell:hover {
      border-color: rgba(31,90,59,0.42);
      box-shadow:
        0 0 0 4px rgba(6,45,32,0.98),
        0 0 0 6px rgba(112,176,133,0.34),
        0 32px 86px rgba(4,14,10,0.48),
        0 42px 130px rgba(4,14,10,0.28),
        inset 0 1px 0 rgba(255,255,255,0.72),
        inset 0 -18px 24px rgba(10,29,20,0.08);
      transform: translateY(-2px);
    }

    #chat-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(74,139,102,0.10) 30%, rgba(255,255,255,0.70) 50%, rgba(74,139,102,0.10) 70%, transparent 100%);
      pointer-events: none;
      z-index: 10;
      border-radius: 36px 36px 0 0;
    }

    #chat-shell::after {
      content: '';
      position: absolute;
      inset: 10px 10px auto 10px;
      height: 46px;
      border-radius: 24px 24px 14px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 100%);
      pointer-events: none;
      opacity: 0.7;
    }

    /* ── Header ── */
    #header {
      flex: 0 0 auto;
      background: rgba(245,240,228,0.88);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-inner);
      position: relative;
      backdrop-filter: blur(14px);
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1f5a3b 0%, #3f7c59 100%);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 6px 14px rgba(31,90,59,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .header-meta {
      min-width: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: #2f8a57;
      border-radius: 50%;
      flex-shrink: 0;
      animation: ping 2.2s ease-in-out infinite;
    }

    @keyframes ping {
      0%, 100% { box-shadow: 0 0 0 0 rgba(47,138,87,0.40); opacity: 1; }
      60% { box-shadow: 0 0 0 5px rgba(47,138,87,0); opacity: 0.8; }
    }

    .header-pitch {
      width: 40%;
      max-width: 360px;
      margin-right: 140px;
      text-align: left;
      flex-shrink: 0;
      animation: fadeSlideInRight 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .header-pitch-top {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: clamp(34px, 3vw, 42px);
      line-height: 0.92;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green-dark);
    }

    .header-pitch-top span {
      color: var(--green-main);
    }

    .header-pitch-bottom {
      margin-top: 10px;
      max-width: 28ch;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.45;
    }

    @keyframes fadeSlideInRight {
      from {
        opacity: 0;
        transform: translateX(36px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ── Trust bar ── */
    #trust-bar {
      flex: 0 0 auto;
      display: none;
    }

    /* ── Messages area ── */
    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, var(--cream-soft) 0%, var(--cream) 100%);
    }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(148,163,184,0.15);
      border-radius: 3px;
    }

    /* ── Bubble rows ── */
    .bubble-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1f5a3b, #4a8b66);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 10px rgba(31,90,59,0.18);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 1px;
    }

    .bubble {
      max-width: min(85%, 520px);
      padding: 13px 17px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.68;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .bubble-row.bot .bubble {
      background: var(--cream-soft);
      color: var(--text);
      border: 1px solid rgba(74,139,102,0.18);
      border-bottom-left-radius: 5px;
      box-shadow: 0 6px 16px rgba(18,44,31,0.06);
    }

    .bubble-row.user .bubble {
      background: var(--green-dark);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-right-radius: 5px;
      box-shadow: 0 8px 20px rgba(15,43,30,0.22);
    }

    /* ── Quick reply chips ── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 0 10px 40px;
      animation: fadeUp 0.25s ease-out 0.1s both;
    }

    .qr-btn {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(74,139,102,0.18);
      color: var(--green-main);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
      letter-spacing: 0.1px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(15,43,30,0.06);
    }

    .qr-btn:hover {
      background: #0b6b46;
      border-color: rgba(11,107,70,0.50);
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(11,107,70,0.28);
    }

    .qr-btn:active { transform: scale(0.98); }

    /* ── Typing indicator ── */
    #typing {
      display: none;
      align-items: flex-end;
      gap: 10px;
      padding: 0 18px 6px;
    }

    #typing.visible { display: flex; }

    .typing-bubble {
      background: var(--cream-soft);
      border: 1px solid rgba(74,139,102,0.14);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      padding: 13px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
      box-shadow: 0 6px 16px rgba(18,44,31,0.06);
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;
      background: rgba(31,90,59,0.45);
      border-radius: 50%;
      animation: bounce 1.3s ease-in-out infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0);    opacity: 0.45; }
      40%            { transform: translateY(-5px); opacity: 1;    }
    }

    /* ── WhatsApp CTA card ── */
    .cta-card {
      background: #f0f7f2;
      border: 1px solid rgba(74,139,102,0.18);
      border-radius: var(--radius);
      padding: 18px;
      margin: 8px 0 6px;
      box-shadow: 0 10px 24px rgba(18,44,31,0.08);
    }

    .cta-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.55;
    }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      background: var(--green-main);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 12px 24px rgba(31,90,59,0.22);
      letter-spacing: -0.1px;
    }

    .btn-whatsapp:hover  { opacity: 0.92; }
    .btn-whatsapp:active { transform: scale(0.98); }

    .btn-whatsapp svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      flex-shrink: 0;
    }

    /* ── Input area ── */
    #input-area {
      flex: 0 0 auto;
      background: rgba(245,240,228,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-inner);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #msg-input {
      flex: 1;
      background: #fffdf8;
      border: 1px solid rgba(74,139,102,0.16);
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 15px;
      color: var(--text);
      resize: none;
      max-height: 120px;
      min-height: 44px;
      line-height: 1.5;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 2px 8px rgba(15,43,30,0.04);
    }

    #msg-input:focus {
      border-color: rgba(74,139,102,0.45);
      box-shadow: inset 0 2px 8px rgba(15,43,30,0.04), 0 0 0 3px rgba(74,139,102,0.10);
    }

    #msg-input::placeholder { color: #789180; }

    #msg-input:disabled { opacity: 0.35; }

    #send-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1f5a3b 0%, #306f4a 100%);
      border: 1px solid rgba(31,90,59,0.15);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 10px 20px rgba(31,90,59,0.24);
    }

    #send-btn:hover  {
      box-shadow: 0 12px 24px rgba(31,90,59,0.30);
      opacity: 0.92;
    }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* ── Session limit notice ── */
    .limit-notice {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 10px 16px;
      letter-spacing: 0.3px;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      body { align-items: stretch; padding: 0; }
      #app { max-width: none; height: 100dvh; }
      #chat-shell {
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        transform: none;
      }
      #chat-shell:hover { transform: none; }
      .header-info {
        gap: 12px;
        align-items: flex-start;
        flex-direction: column;
      }
      .header-pitch {
        width: 100%;
        max-width: none;
        margin-right: 0;
      }
      .header-pitch-top {
        font-size: 24px;
      }
      .header-pitch-bottom {
        font-size: 12px;
      }
      .quick-replies {
        padding-left: 0;
      }
      #messages {
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #header {
        padding: 12px 14px;
      }
      #input-area {
        padding: 10px 12px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      .bubble {
        max-width: 90%;
      }
    }

    @media (max-width: 430px) {
      .header-pitch {
        max-width: none;
      }
      .header-pitch-bottom {
        white-space: normal;
      }
      .header-avatar {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .header-title {
        font-size: 13px;
      }
      .header-sub {
        font-size: 10px;
      }
      .bubble {
        max-width: 92%;
        font-size: 14px;
        padding: 12px 15px;
      }
      .avatar {
        width: 26px;
        height: 26px;
        font-size: 10px;
      }
    }

    @media (max-width: 380px) {
      body { padding: 0; }
      #chat-shell { border-radius: 0; }
    }
  </style>
</head>
<body>
<div id="app">

  <div id="chat-shell">
    <!-- Header -->
    <div id="header">
      <div class="header-avatar">A</div>
      <div class="header-info">
        <div class="header-meta">
          <div class="header-title">Alex — Asistente JB Studio</div>
          <div class="header-sub">
            <span class="online-dot"></span>
            En línea 24/7
          </div>
        </div>
        <div class="header-pitch">
          <div class="header-pitch-top">ASISTENTE <span>JB STUDIO</span></div>
          <div class="header-pitch-bottom">Online 24/7 — Respondemos por tu negocio</div>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages"></div>

    <!-- Typing indicator -->
    <div id="typing">
      <div class="avatar">A</div>
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Input -->
    <div id="input-area">
      <div class="input-row">
        <textarea id="msg-input" placeholder="Escribí tu mensaje aquí..." rows="1"></textarea>
        <button id="send-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  // ── Config ───────────────────────────────────────────────────────────────
  var WHATSAPP_MIKE = '15035931690';

  var MAX_MESSAGES  = 30;
  var API_ENDPOINT  = '/api/ventas-chat';
  var VISIT_TRACK_ENDPOINT = '/api/track-ventas-funnel';
  var CHAT_START_TRACK_ENDPOINT = '/api/track-ventas-funnel';

  // ── State ────────────────────────────────────────────────────────────────
  var msgs         = [];
  var msgCount     = 0;
  var waiting      = false;
  var summaryShown = false;
  var quickDone    = false;
  var currentSelectedOption = '';
  var pricingShown = false;
  var conversationStarted = false;
  var leadTracked = false;
  var contactHumanTracked = false;

  var WELCOME_1 = 'Hola, soy Alex de JB Studio.';
  var WELCOME_2 = 'Ayudo a negocios a no perder clientes cuando nadie puede responder. ¿Qué tipo de negocio tienes?';
  var WELCOME = WELCOME_1 + '\n\n' + WELCOME_2;

  var PRICING_MSG = 'Trabajo con 2 planes:\n\nBásico — $49/mes\nResponde preguntas del negocio (horarios, precios, servicios, ubicación, dudas frecuentes).\n\nPro — $65/mes\nAdemás de responder, también toma reservas, guarda datos de clientes interesados y avisa por correo.\n\nSin costo de instalación. Ambos planes requieren compromiso mínimo de 3 meses porque el asistente se configura específicamente para tu negocio.';

  var QUICK_REPLIES = ['Barbería', 'Restaurante', 'Spa / Belleza', 'Clínica', 'Otro negocio'];

  // ── DOM refs ─────────────────────────────────────────────────────────────
  var messagesEl = document.getElementById('messages');
  var typingEl   = document.getElementById('typing');
  var inputEl    = document.getElementById('msg-input');
  var sendBtn    = document.getElementById('send-btn');

  // ── Render helpers ───────────────────────────────────────────────────────
  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderBotText(text) {
    return escapeHtml(text)
      .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\n/g, '<br>');
  }

  function addMsg(role, text) {
    var row = document.createElement('div');
    row.className = 'bubble-row ' + role;

    if (role === 'bot') {
      var av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = 'A';
      row.appendChild(av);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'bot') {
      bubble.innerHTML = renderBotText(text);
    } else {
      bubble.textContent = text;
    }
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    scrollBottom(isNearBottom() || role === 'user');
  }

  function showQuickReplies() {
    var wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    wrap.id = 'quick-replies';

    QUICK_REPLIES.forEach(function (label) {
      var btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = label;
      btn.addEventListener('click', function () {
        if (waiting || quickDone) return;
        currentSelectedOption = label;
        inputEl.value = label;
        send();
      });
      wrap.appendChild(btn);
    });

    messagesEl.appendChild(wrap);
    scrollBottom(isNearBottom());
  }

  function hideQuickReplies() {
    var el = document.getElementById('quick-replies');
    if (el) el.remove();
  }

  function showCTA(summaryText, helperText, buttonText) {
    var waText = encodeURIComponent(summaryText);
    var waUrl  = 'https://wa.me/' + WHATSAPP_MIKE + '?text=' + waText;

    var card = document.createElement('div');
    card.className = 'cta-card';

    var p = document.createElement('p');
    p.textContent = helperText;
    card.appendChild(p);

    var link = document.createElement('a');
    link.className = 'btn-whatsapp';
    link.href       = waUrl;
    link.target     = '_blank';
    link.rel        = 'noopener noreferrer';
    link.innerHTML  = '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' + buttonText;
    link.addEventListener('click', function () {
      if (contactHumanTracked) return;
      if (typeof window.fbq !== 'function') return;
      contactHumanTracked = true;
      window.fbq('trackCustom', 'ClickContactoHumano');
    });
    card.appendChild(link);

    messagesEl.appendChild(card);
    scrollBottom(isNearBottom());
  }

  function scrollBottom(force) {
    if (force !== false) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function isNearBottom() {
    var threshold = 80;
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < threshold;
  }

  function setWaiting(on) {
    waiting = on;
    sendBtn.disabled = on;
    typingEl.classList.toggle('visible', on);
    if (on) scrollBottom(isNearBottom());
  }

  function containsBlockedLink(text) {
    var value = String(text || '');
    // Solo bloquea URLs reales (protocolo http(s):// o prefijo www.), no
    // cualquier palabra que termine en .com/.mx/etc (ej: nombres de dominio
    // que un cliente menciona al pasar, como "barbertest.com").
    var hasLink = /\b(?:https?:\/\/|www\.)\S+/i.test(value);
    var allowed = /(?:https?:\/\/)?(?:www\.)?(?:jbstudio\.app|chatbot-demo-steel-delta\.vercel\.app)(?:\/[^\s]*)?/i.test(value);
    return hasLink && !allowed;
  }

  function trackLeadOnce() {
    if (leadTracked) return;
    if (typeof window.fbq !== 'function') return;
    leadTracked = true;
    window.fbq('track', 'Lead');
  }

  function getUtmPayload() {
    var params = new URLSearchParams(window.location.search);
    return {
      timestamp: new Date().toISOString(),
      utm_source: params.get('utm_source') || 'directo',
      utm_campaign: params.get('utm_campaign') || 'directo',
      utm_medium: params.get('utm_medium') || 'directo'
    };
  }

  function getSessionId() {
    try {
      var existing = sessionStorage.getItem('ventas_session_id');
      if (existing) return existing;
      var created = 'ventas_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem('ventas_session_id', created);
      return created;
    } catch (err) {
      return 'ventas_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }
  }

  function trackVisitOnce() {
    try {
      if (sessionStorage.getItem('visit_tracked')) return;
      sessionStorage.setItem('visit_tracked', '1');
    } catch (err) {
      console.error('[ventas] visit session flag failed', err);
    }

    fetch(VISIT_TRACK_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ type: 'visit' }, getUtmPayload()))
    }).catch(function (err) {
      console.error('[ventas] track visit failed', err);
    });
  }

  function trackChatStartOnce() {
    try {
      if (sessionStorage.getItem('chat_started')) return;
      sessionStorage.setItem('chat_started', '1');
    } catch (err) {
      console.error('[ventas] chat-start session flag failed', err);
    }

    fetch(CHAT_START_TRACK_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'chat_start', timestamp: new Date().toISOString() })
    }).catch(function (err) {
      console.error('[ventas] track chat start failed', err);
    });
  }

  function trackConversationStart() {
    if (conversationStarted) return;
    if (typeof window.fbq !== 'function') return;
    try {
      if (sessionStorage.getItem('inicio_conversacion_tracked')) return;
      sessionStorage.setItem('inicio_conversacion_tracked', '1');
    } catch (err) {
      console.error('[ventas] inicio_conversacion session flag failed', err);
    }
    conversationStarted = true;
    window.fbq('trackCustom', 'InicioConversacion');
  }

  // ── Auto-resize textarea ─────────────────────────────────────────────────
  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // ── Send ─────────────────────────────────────────────────────────────────
  function send() {
    var text = inputEl.value.trim();
    if (!text || waiting) return;

    if (containsBlockedLink(text)) {
      addMsg('bot', 'Por políticas de seguridad no puedo procesar links en el chat, contame de otra forma.');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      return;
    }

    if (msgCount >= MAX_MESSAGES) {
      addMsg('bot', 'Alcanzaste el límite de mensajes de esta sesión. Refrescá la página para empezar de nuevo.');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      return;
    }

    if (!quickDone) {
      quickDone = true;
      hideQuickReplies();
    }

    trackChatStartOnce();
    trackConversationStart();

    msgCount++;
    addMsg('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    // Include the welcome message as the first assistant turn
    var history = [];
    if (msgs.length === 0) {
      history.push({ role: 'assistant', content: WELCOME });
    } else {
      history = msgs.slice();
    }
    history.push({ role: 'user', content: text });

    setWaiting(true);

    fetch(API_ENDPOINT, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(Object.assign({
        messages: history,
        sessionId: getSessionId(),
        selectedOption: currentSelectedOption || ''
      }, getUtmPayload())),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        setWaiting(false);

        if (d.error) {
          addMsg('bot', d.error);
          return;
        }

        var raw = d.text || '';
        var leadQualified = d.leadQualified === true;

        if (raw.includes('[LEAD_MINIMO]')) {
          if (leadQualified) trackLeadOnce();
          var minimumText = raw.replace('[LEAD_MINIMO]', '').trim();
          if (minimumText) addMsg('bot', minimumText);
          msgs.push({ role: 'user', content: text });
          msgs.push({ role: 'assistant', content: raw });
        } else if (!summaryShown && raw.includes('[MOSTRAR_CONTACTO_HUMANO]')) {
          summaryShown = true;
          if (leadQualified) trackLeadOnce();
          var humanText = raw.replace('[MOSTRAR_CONTACTO_HUMANO]', '').trim();
          var humanParts = humanText.split('\n\n');
          var humanReply = humanParts.shift() || '';
          var humanSummary = humanParts.join('\n\n').trim();
          if (humanReply) addMsg('bot', humanReply);
          if (humanSummary) {
            showCTA(humanSummary, 'El equipo de JB Studio ya tiene el contexto. Hacé clic abajo para abrir WhatsApp con el mensaje listo.', 'Escribir al equipo por WhatsApp');
          }
          msgs.push({ role: 'assistant', content: raw });
          inputEl.disabled = true;
          sendBtn.disabled = true;
          var humanNotice = document.createElement('div');
          humanNotice.className = 'limit-notice';
          humanNotice.textContent = 'Contacto listo para que el equipo de JB Studio continúe la conversación.';
          messagesEl.appendChild(humanNotice);
          scrollBottom(true);
        } else if (!summaryShown && raw.includes('[MOSTRAR_RESUMEN]')) {
          summaryShown = true;
          if (leadQualified) trackLeadOnce();
          var cleanText = raw.replace('[MOSTRAR_RESUMEN]', '').trim();
          if (cleanText) addMsg('bot', cleanText);
          showCTA(cleanText, 'Tu información está lista. Hacé clic abajo para escribirle al equipo de JB Studio por WhatsApp y coordinar el inicio.', 'Escribir al equipo por WhatsApp');
          msgs.push({ role: 'assistant', content: raw });
          inputEl.disabled = true;
          sendBtn.disabled = true;
          var notice = document.createElement('div');
          notice.className = 'limit-notice';
          notice.textContent = 'Resumen listo. Enviáselo al equipo de JB Studio para coordinar el inicio.';
          messagesEl.appendChild(notice);
          scrollBottom(true);
        } else {
          addMsg('bot', raw);
          msgs.push({ role: 'user', content: text });
          msgs.push({ role: 'assistant', content: raw });
          if (!pricingShown) {
            pricingShown = true;
            setWaiting(true);
            setTimeout(function () {
              setWaiting(false);
              addMsg('bot', PRICING_MSG);
            }, 600);
          }
        }
      })
      .catch(function () {
        setWaiting(false);
        addMsg('bot', 'Error de conexión. Verificá tu internet e intentá de nuevo.');
      });
  }

  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // ── Init: show welcome + quick replies ───────────────────────────────────
  setTimeout(function () {
    trackVisitOnce();
    addMsg('bot', WELCOME_1);
    setWaiting(true);
    setTimeout(function () {
      setWaiting(false);
      addMsg('bot', WELCOME_2);
      setTimeout(showQuickReplies, 120);
    }, 700);
  }, 400);

})();
</script>
