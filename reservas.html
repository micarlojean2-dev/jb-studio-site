<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas — JB Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f4ee;      /* beige claro */
      --card: #ffffff;
      --line: #e7e3d9;
      --ink: #23211c;
      --muted: #7c7768;
      --accent: #1a4a2e;
      --cancel: #b23b3b;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Cabecera ── */
    .hdr {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .hdr-biz { font-size: 17px; font-weight: 650; flex: 1; min-width: 0; }
    .hdr-btn {
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 9px; padding: 8px 13px;
    }
    .hdr-btn:hover { border-color: #cfc9bb; }
    .hdr-btn.ghost { color: var(--muted); border-color: transparent; }

    .wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 60px; }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    /* ── Filtros (solo dos) ── */
    .filters { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-btn {
      font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      background: var(--card); color: var(--muted); border: 1px solid var(--line);
      border-radius: 20px; padding: 8px 16px;
    }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Tarjetas de citas (una por reserva, fáciles de leer) ── */
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 14px; }
    .rcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 13px; }
    .rrow { display: flex; align-items: baseline; gap: 9px; font-size: 14px; padding: 3px 0; }
    .rrow .ic { flex: none; width: 18px; text-align: center; }
    .rrow .rlbl { flex: none; color: var(--muted); font-size: 12.5px; width: 66px; }
    .rrow .rval { color: var(--ink); word-break: break-word; }
    .rname { font-size: 17px; font-weight: 650; }
    .rnotes { margin-top: 11px; padding: 10px 12px; background: #faf8f2; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
    .rnotes-t { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    .rfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
    .rcreated { font-size: 11.5px; color: var(--muted); text-align: right; }
    .estado { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 20px; white-space: nowrap; }
    .estado.nueva        { background: #e7f2ea; color: #1a7a3e; }   /* verde */
    .estado.reprogramada { background: #e6effb; color: #1f5fae; }   /* azul */
    .estado.cancelada    { background: #fbe9e9; color: #b23b3b; }   /* rojo */
    .estado.pendiente    { background: #fdf0e0; color: #b5721a; }   /* naranja */

    .empty { grid-column: 1 / -1; padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .updated { font-size: 12px; color: var(--muted); margin-top: 14px; text-align: right; }

    /* ── Login ── */
    #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; }
    .login-card h2 { font-size: 20px; margin-bottom: 6px; }
    .login-card p { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .login-inp { width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fbfaf6; }
    .login-inp:focus { outline: none; border-color: var(--accent); }
    .login-go { width: 100%; margin-top: 10px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; }
    .login-go:disabled { opacity: .6; cursor: not-allowed; }
    .login-err { display: none; color: var(--cancel); font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login">
    <div class="login-card">
      <h2>Tus citas</h2>
      <p id="login-desc">Introduce tu clave de acceso para ver las citas de tu negocio.</p>
      <input class="login-inp" id="token-inp" type="password" placeholder="Clave de acceso" autocomplete="off">
      <button class="login-go" id="login-btn" onclick="doLogin()">Entrar</button>
      <div class="login-err" id="login-err">Clave incorrecta. Inténtalo de nuevo.</div>
    </div>
  </div>

  <!-- Panel -->
  <div id="panel" style="display:none">
    <div class="hdr">
      <span class="hdr-biz" id="hdr-biz"></span>
      <button class="hdr-btn" id="refresh-btn" onclick="loadReservations()">↻ Actualizar</button>
      <button class="hdr-btn ghost" onclick="logout()">Salir</button>
    </div>
    <div class="wrap">
      <h1>Citas</h1>
      <div class="sub" id="count">—</div>
      <div class="filters">
        <button class="filter-btn active" data-f="proximas" onclick="setFilter('proximas',this)">Próximas</button>
        <button class="filter-btn" data-f="canceladas" onclick="setFilter('canceladas',this)">Canceladas</button>
      </div>
      <div class="sheet" id="sheet"></div>
      <div class="updated" id="updated"></div>
    </div>
  </div>

<script>
  // clientId desde ?id= o /reservas/{id}. El token viaja por fragmento (#t=),
  // que el navegador nunca manda al servidor — nunca en la query string.
  function sanitizeId(raw) {
    var v = String(raw || '').trim().toLowerCase();
    return /^[a-z0-9-]{1,80}$/.test(v) ? v : '';
  }
  function resolveClientId() {
    var q = '';
    try { q = new URLSearchParams(window.location.search).get('id') || ''; } catch (e) {}
    if (q) return sanitizeId(q);
    var parts = window.location.pathname.split('/').filter(Boolean);
    var idx = parts.indexOf('reservas');
    return sanitizeId(idx !== -1 ? (parts[idx + 1] || '') : (parts[1] || ''));
  }

  var clientId  = resolveClientId();
  var API       = 'https://jbstudio.app';
  var STORE_KEY = 'jbr_' + clientId + '_token';
  var currentToken = '';
  var allData = [];
  var activeFilter = 'proximas';
  var refreshTimer = null;

  if (!clientId) {
    document.getElementById('login-desc').textContent = 'Enlace inválido. Accede como jbstudio.app/reservas/tu-negocio';
    document.getElementById('login-btn').disabled = true;
  }

  window.addEventListener('DOMContentLoaded', function () {
    var frag = '';
    if (window.location.hash && window.location.hash.indexOf('t=') !== -1) {
      frag = decodeURIComponent(window.location.hash.replace(/^#t=/, ''));
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    if (frag) tryToken(frag);
    else { var saved = localStorage.getItem(STORE_KEY); if (saved) tryToken(saved); }
    document.getElementById('token-inp').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  });

  function doLogin() {
    var t = document.getElementById('token-inp').value.trim();
    if (!t) return;
    var b = document.getElementById('login-btn');
    b.disabled = true; b.textContent = 'Verificando…';
    document.getElementById('login-err').style.display = 'none';
    tryToken(t);
  }

  function fetchList(t) {
    return fetch(API + '/api/reservations-list?clientId=' + encodeURIComponent(clientId) + '&token=' + encodeURIComponent(t))
      .then(function (r) {
        if (r.status === 401) throw new Error('unauthorized');
        if (!r.ok) throw new Error('error');
        return r.json();
      });
  }

  function tryToken(t) {
    fetchList(t)
      .then(function (data) {
        currentToken = t;
        localStorage.setItem(STORE_KEY, t);
        showPanel(data);
      })
      .catch(function (err) {
        localStorage.removeItem(STORE_KEY);
        var b = document.getElementById('login-btn');
        b.disabled = false; b.textContent = 'Entrar';
        if (err.message === 'unauthorized') document.getElementById('login-err').style.display = 'block';
      });
  }

  function showPanel(data) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    document.getElementById('hdr-biz').textContent = clientId.replace(/-/g, ' ');
    allData = data || [];
    render();
    startAutoRefresh();
  }

  // Carga bajo demanda (botón Actualizar). No hay polling continuo.
  function loadReservations() {
    fetchList(currentToken)
      .then(function (data) { allData = data || []; render(); })
      .catch(function () {});
  }

  // Refresco cada 5 min SOLO si la pestaña está visible — nada de peticiones
  // en segundo plano. Se salta el ciclo si la pestaña está oculta.
  function startAutoRefresh() {
    if (refreshTimer) return;
    refreshTimer = setInterval(function () {
      if (document.visibilityState === 'visible') loadReservations();
    }, 5 * 60 * 1000);
  }

  function logout() {
    localStorage.removeItem(STORE_KEY);
    currentToken = ''; allData = [];
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    document.getElementById('panel').style.display = 'none';
    document.getElementById('login').style.display = 'flex';
    document.getElementById('token-inp').value = '';
    var b = document.getElementById('login-btn');
    b.disabled = false; b.textContent = 'Entrar';
  }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(function (x) { x.classList.remove('active'); });
    btn.classList.add('active');
    render();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Estados que ve el dueño: Nueva / Reprogramada / Cancelada. Nada más.
  function estadoInfo(r) {
    if (r.estado === 'cancelada' || r.estado === 'rechazada') return { cls: 'cancelada', txt: 'Cancelada' };
    if (r.estado === 'reprogramada') return { cls: 'reprogramada', txt: 'Reprogramada' };
    return { cls: 'nueva', txt: 'Nueva' };
  }

  function filtered() {
    if (activeFilter === 'canceladas') {
      return allData.filter(function (r) { return r.estado === 'cancelada' || r.estado === 'rechazada'; });
    }
    // Próximas: todo lo que no está cancelado.
    return allData.filter(function (r) { return r.estado !== 'cancelada' && r.estado !== 'rechazada'; });
  }

  // "Creada hace 12 minutos" si es reciente; si no, fecha real almacenada.
  function fechaCreacion(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var min = Math.floor((Date.now() - d.getTime()) / 60000);
    if (min < 1)  return 'Creada hace unos segundos';
    if (min < 60) return 'Creada hace ' + min + (min === 1 ? ' minuto' : ' minutos');
    var h = Math.floor(min / 60);
    if (h < 24)   return 'Creada hace ' + h + (h === 1 ? ' hora' : ' horas');
    var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    var fecha = d.getDate() + ' ' + meses[d.getMonth()] + ' ' + d.getFullYear();
    return 'Creada el ' + fecha + ' · ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }

  function fila(icon, label, val) {
    if (!val) return '';
    return '<div class="rrow"><span class="ic">' + icon + '</span>' +
      '<span class="rlbl">' + label + '</span><span class="rval">' + esc(val) + '</span></div>';
  }

  function cardHTML(r) {
    var e = estadoInfo(r);
    var notes = String(r.notes == null ? '' : r.notes).trim();
    // Notas: solo si existen. Si no, no se muestra absolutamente nada.
    var notesHTML = notes
      ? '<div class="rnotes"><div class="rnotes-t">📝 Notas</div>' + esc(notes) + '</div>'
      : '';
    var creada = fechaCreacion(r.fechaSolicitud);
    return '<div class="rcard">' +
        '<div class="rrow"><span class="ic">👤</span><span class="rname">' + esc(r.nombre || '—') + '</span></div>' +
        fila('💆', 'Servicio', r.servicio) +
        fila('👥', 'Personas', r.partySize || r.personas) +
        fila('📅', 'Fecha', r.fecha) +
        fila('🕒', 'Hora', r.hora) +
        fila('🪑', 'Mesa', r.tablePreference) +
        fila('✂️', 'Barbero', r.barberPreference) +
        fila('📞', 'Teléfono', r.telefono) +
        fila('✉️', 'Correo', r.email) +
        notesHTML +
        '<div class="rfoot"><span class="estado ' + e.cls + '">' + e.txt + '</span>' +
          (creada ? '<span class="rcreated">' + esc(creada) + '</span>' : '') +
        '</div>' +
      '</div>';
  }

  function render() {
    var data = filtered().slice().sort(function (a, b) {
      return String(a.fechaISO || '').localeCompare(String(b.fechaISO || '')) ||
             String(a.horaISO || '').localeCompare(String(b.horaISO || ''));
    });
    document.getElementById('count').textContent =
      data.length + (data.length === 1 ? ' cita' : ' citas') + (activeFilter === 'canceladas' ? ' canceladas' : ' próximas');

    var sheet = document.getElementById('sheet');
    if (!data.length) {
      sheet.innerHTML = '<div class="empty">No hay citas ' + (activeFilter === 'canceladas' ? 'canceladas' : 'próximas') + '.</div>';
    } else {
      sheet.innerHTML = data.map(cardHTML).join('');
    }
    var now = new Date();
    document.getElementById('updated').textContent = 'Actualizado ' + now.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }
</script>
</body>
</html>
