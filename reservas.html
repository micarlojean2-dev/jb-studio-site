<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Reservas — JB Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --surface: #161616;
      --border:  #2a2a2a;
      --text:    #e8e8e8;
      --muted:   #888;
      --green:   #4ade80;
      --accent:  #1a4a2e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ── Header ── */
    .hdr {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hdr-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .hdr-logo img { width: 32px; height: 32px; border-radius: 6px; }
    .hdr-logo span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--text);
    }
    .hdr-sep { flex: 1; }
    .hdr-biz {
      font-size: 12px;
      color: var(--muted);
      background: var(--border);
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* ── Login screen ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 65px);
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 400px;
      width: 100%;
    }
    .login-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .login-card p {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .login-card label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .login-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      margin-bottom: 16px;
    }
    .login-card input:focus { border-color: var(--green); }
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .login-err {
      margin-top: 12px;
      font-size: 12px;
      color: #f87171;
      display: none;
    }

    /* ── Main panel ── */
    #panel-screen { display: none; }

    .panel-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    .panel-title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .panel-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }
    .panel-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--border);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover { border-color: var(--green); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Table ── */
    .tbl-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 900px;
    }
    thead th {
      background: var(--surface);
      color: var(--muted);
      font-weight: 500;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface); }
    td {
      padding: 13px 14px;
      vertical-align: top;
      color: var(--text);
      max-width: 180px;
      word-break: break-word;
    }
    td.muted { color: var(--muted); font-size: 11px; }

    /* ── Estado badges ── */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .badge-pendiente  { background: #78350f22; color: #fbbf24; border: 1px solid #78350f88; }
    .badge-confirmada { background: #14532d22; color: #4ade80; border: 1px solid #14532d88; }
    .badge-rechazada  { background: #7f1d1d22; color: #f87171; border: 1px solid #7f1d1d88; }
    .badge-cancelada  { background: #27272722; color: #888;    border: 1px solid #3f3f3f88; }

    /* ── Action buttons ── */
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 9px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .act-btn:hover { color: var(--text); border-color: #555; }
    .act-btn.confirm { color: #4ade80; border-color: #14532d88; }
    .act-btn.confirm:hover { background: #14532d44; }
    .act-btn.reject  { color: #f87171; border-color: #7f1d1d88; }
    .act-btn.reject:hover  { background: #7f1d1d44; }
    .act-btn.cancel  { color: #888;    border-color: #3f3f3f88; }
    .act-btn.cancel:hover  { background: #27272744; }
    .act-btn:disabled { opacity: .3; cursor: not-allowed; }

    /* ── Empty / loading ── */
    .panel-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .panel-msg p { margin-top: 8px; font-size: 11px; }

    /* ── Logout ── */
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .logout-btn:hover { color: var(--text); border-color: #555; }

    /* ── Refresh ── */
    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: #555; }

    @media (max-width: 600px) {
      .panel-wrap { padding: 16px 12px; }
      .login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="hdr">
    <a href="https://jbstudio.app" class="hdr-logo">
      <img src="/public/chatbot-logo.png" alt="JB Studio">
      <span>JB STUDIO</span>
    </a>
    <div class="hdr-sep"></div>
    <span class="hdr-biz" id="hdr-biz" style="display:none"></span>
    <button class="logout-btn" id="logout-btn" style="display:none" onclick="logout()">Cerrar sesión</button>
  </header>

  <!-- ── Login ── -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Panel de Reservas</h2>
      <p id="login-desc">Ingresa tu clave de acceso para ver las reservas.</p>
      <label for="token-inp">Clave de acceso</label>
      <input type="password" id="token-inp" placeholder="••••••••••••••••••••" autocomplete="off">
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Ingresar →</button>
      <div class="login-err" id="login-err">Clave incorrecta. Verifica e intenta de nuevo.</div>
    </div>
  </div>

  <!-- ── Panel ── -->
  <div id="panel-screen">
    <div class="panel-wrap">
      <div class="panel-title-row">
        <span class="panel-title">Reservas</span>
        <span class="panel-count" id="panel-count">—</span>
        <div style="flex:1"></div>
        <button class="refresh-btn" onclick="loadReservations()">↻ Actualizar</button>
      </div>

      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all"       onclick="setFilter('all',this)">Todas</button>
        <button class="filter-btn"        data-filter="pendiente" onclick="setFilter('pendiente',this)">Pendientes</button>
        <button class="filter-btn"        data-filter="confirmada" onclick="setFilter('confirmada',this)">Confirmadas</button>
        <button class="filter-btn"        data-filter="rechazada" onclick="setFilter('rechazada',this)">Rechazadas</button>
        <button class="filter-btn"        data-filter="cancelada" onclick="setFilter('cancelada',this)">Canceladas</button>
      </div>

      <div class="tbl-wrap" id="tbl-wrap">
        <div class="panel-msg" id="panel-loading">Cargando reservas…</div>
      </div>
    </div>
  </div>

<script>
  // ── Extract clientId from URL ────────────────────────────────────────────
  // Fase 4.2: se resuelve desde ?id= o desde el pathname (/reservas/{id}),
  // para no depender de una única configuración de Vercel. Solo se aceptan
  // minúsculas, números y guiones — antes no se sanitizaba el segmento.
  // El token NO se lee de la query string a propósito: viaja por fragmento
  // (#t=), que el navegador nunca envía al servidor.
  function resolveClientId() {
    var fromQuery = '';
    try {
      fromQuery = new URLSearchParams(window.location.search).get('id') || '';
    } catch (e) {
      fromQuery = '';
    }
    if (fromQuery) return sanitizeId(fromQuery);

    var parts = window.location.pathname.split('/').filter(Boolean);
    var idx   = parts.indexOf('reservas');
    var seg   = idx !== -1 ? (parts[idx + 1] || '') : (parts[1] || '');
    return sanitizeId(seg);
  }

  function sanitizeId(raw) {
    var v = String(raw || '').trim().toLowerCase();
    return /^[a-z0-9-]{1,80}$/.test(v) ? v : '';
  }

  var clientId  = resolveClientId();
  var API       = 'https://jbstudio.app';
  var STORE_KEY = 'jbr_' + clientId + '_token';

  if (!clientId) {
    document.getElementById('login-desc').textContent = 'URL inválida. Asegúrate de acceder como: jbstudio.app/reservas/{tu-id}';
    document.getElementById('login-btn').disabled = true;
  }

  // ── State ────────────────────────────────────────────────────────────────
  var currentToken = '';
  var allData      = [];
  var activeFilter = 'all';

  // ── Try saved token on load ───────────────────────────────────────────────
  // A token can also arrive once via a URL fragment (#t=...) — e.g. from the
  // admin panel's "Ver panel de reservas" button right after creating a
  // client. The fragment is never sent to the server and is scrubbed from
  // the visible address bar immediately, so the token is never shown as
  // plain text anywhere in the admin UI.
  window.addEventListener('DOMContentLoaded', function () {
    var fragToken = '';
    if (window.location.hash && window.location.hash.indexOf('t=') !== -1) {
      fragToken = decodeURIComponent(window.location.hash.replace(/^#t=/, ''));
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    if (fragToken) {
      tryToken(fragToken);
    } else {
      var saved = localStorage.getItem(STORE_KEY);
      if (saved) tryToken(saved);
    }

    document.getElementById('token-inp').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  });

  function doLogin() {
    var t = document.getElementById('token-inp').value.trim();
    if (!t) return;
    document.getElementById('login-btn').disabled = true;
    document.getElementById('login-btn').textContent = 'Verificando…';
    document.getElementById('login-err').style.display = 'none';
    tryToken(t);
  }

  function tryToken(t) {
    fetch(API + '/api/reservations-list?clientId=' + encodeURIComponent(clientId) + '&token=' + encodeURIComponent(t))
      .then(function (r) {
        if (r.status === 401) throw new Error('unauthorized');
        if (!r.ok) throw new Error('error');
        return r.json();
      })
      .then(function (data) {
        currentToken = t;
        localStorage.setItem(STORE_KEY, t);
        showPanel(data);
      })
      .catch(function (err) {
        localStorage.removeItem(STORE_KEY);
        document.getElementById('login-btn').disabled = false;
        document.getElementById('login-btn').textContent = 'Ingresar →';
        if (err.message === 'unauthorized') {
          document.getElementById('login-err').style.display = 'block';
        }
      });
  }

  function showPanel(data) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel-screen').style.display = 'block';
    document.getElementById('logout-btn').style.display   = 'inline-block';
    var biz = document.getElementById('hdr-biz');
    biz.style.display  = 'inline-block';
    biz.textContent    = clientId;
    allData = data;
    renderTable(data);
  }

  function loadReservations() {
    fetch(API + '/api/reservations-list?clientId=' + encodeURIComponent(clientId) + '&token=' + encodeURIComponent(currentToken))
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (data) { allData = data; renderTable(filtered(data)); })
      .catch(function () {});
  }

  function logout() {
    localStorage.removeItem(STORE_KEY);
    currentToken = ''; allData = [];
    document.getElementById('panel-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('logout-btn').style.display   = 'none';
    document.getElementById('hdr-biz').style.display      = 'none';
    document.getElementById('token-inp').value = '';
    document.getElementById('login-btn').disabled  = false;
    document.getElementById('login-btn').textContent = 'Ingresar →';
  }

  // ── Filter ───────────────────────────────────────────────────────────────
  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderTable(filtered(allData));
  }

  function filtered(data) {
    if (activeFilter === 'all') return data;
    return data.filter(function (r) { return r.estado === activeFilter; });
  }

  // ── Render table ─────────────────────────────────────────────────────────
  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('es', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return iso.slice(0, 16).replace('T', ' '); }
  }

  function badge(estado) {
    var labels = { pendiente: 'Pendiente', confirmada: 'Confirmada', rechazada: 'Rechazada', cancelada: 'Cancelada' };
    return '<span class="badge badge-' + (estado || 'pendiente') + '">' + (labels[estado] || estado) + '</span>';
  }

  function actionBtns(r) {
    var k   = encodeKey(r._key);
    var est = r.estado;
    var html = '<div class="actions">';
    if (est !== 'confirmada' && est !== 'cancelada' && est !== 'rechazada') {
      html += '<button class="act-btn confirm" onclick="updateEstado(\'' + k + '\',\'confirmada\')">✓ Confirmar</button>';
    }
    if (est !== 'rechazada' && est !== 'cancelada') {
      html += '<button class="act-btn reject" onclick="updateEstado(\'' + k + '\',\'rechazada\')">✗ Rechazar</button>';
    }
    if (est !== 'cancelada') {
      html += '<button class="act-btn cancel" onclick="updateEstado(\'' + k + '\',\'cancelada\')">○ Cancelar</button>';
    }
    html += '</div>';
    return html;
  }

  function encodeKey(k) { return encodeURIComponent(k); }

  function renderTable(data) {
    var wrap  = document.getElementById('tbl-wrap');
    var count = document.getElementById('panel-count');
    count.textContent = data.length + ' reserva' + (data.length !== 1 ? 's' : '');

    if (!data.length) {
      wrap.innerHTML = '<div class="panel-msg">No hay reservas' +
        (activeFilter !== 'all' ? ' con estado "' + activeFilter + '"' : '') + '.' +
        '<p>Las reservas aparecen aquí cuando los clientes las soliciten desde el chat.</p></div>';
      return;
    }

    var rows = data.map(function (r) {
      return '<tr>' +
        '<td class="muted">' + fmtDate(r.fechaSolicitud) + '</td>' +
        '<td><strong>' + esc(r.nombre) + '</strong></td>' +
        '<td>' + esc(r.telefono) + '</td>' +
        '<td class="muted">' + esc(r.email || '—') + '</td>' +
        '<td>' + esc(r.fecha) + '</td>' +
        '<td>' + esc(r.hora) + '</td>' +
        '<td class="muted">' + esc(r.servicio || '—') + '</td>' +
        '<td>' + (r.personas ? esc(r.personas) : '<span class="muted">—</span>') + '</td>' +
        '<td class="muted">' + esc(r.nota || '—') + '</td>' +
        '<td>' + badge(r.estado) + '</td>' +
        '<td>' + actionBtns(r) + '</td>' +
        '</tr>';
    }).join('');

    wrap.innerHTML = '<table>' +
      '<thead><tr>' +
        '<th>Solicitud</th><th>Nombre</th><th>Teléfono</th><th>Email</th>' +
        '<th>Fecha</th><th>Hora</th><th>Servicio</th><th>Personas</th><th>Nota</th>' +
        '<th>Estado</th><th>Acciones</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Update estado ─────────────────────────────────────────────────────────
  function updateEstado(encodedKey, estado) {
    var key = decodeURIComponent(encodedKey);
    var btns = document.querySelectorAll('.act-btn');
    btns.forEach(function (b) { b.disabled = true; });

    fetch(API + '/api/reservations-list?clientId=' + encodeURIComponent(clientId) + '&token=' + encodeURIComponent(currentToken), {
      method:  'PUT',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ clientId: clientId, token: currentToken, key: key, estado: estado }),
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function () { loadReservations(); })
      .catch(function () {
        btns.forEach(function (b) { b.disabled = false; });
        alert('Error al actualizar. Intenta de nuevo.');
      });
  }
</script>
</body>
</html>
